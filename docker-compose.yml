# DentaCore üretim yığını. Ağ ilkesi: yalnızca Traefik internete açık; veritabanı, Redis, yedek ve PACS
# "core" adlı iç ağda (internal: true) kalır ve dışarıdan erişilemez.
# Başlatma: cp .env.example .env  ->  değerleri doldur  ->  docker compose up -d
# Görüntüleme (Orthanc PACS) isteğe bağlı: docker compose --profile imaging up -d
name: dentacore

x-restart: &restart
  restart: unless-stopped

services:
  traefik:
    <<: *restart
    image: traefik:v3.1
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=dentacore_edge
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls.certresolver=le
      - --certificatesresolvers.le.acme.tlschallenge=true
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --api.dashboard=false
      - --log.level=WARN
      - --accesslog=false
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    # Sabit IP: api yaln?zca bu adresten gelen X-Forwarded-* ba?l?klar?na g?venir (FORWARDED_ALLOW_IPS).
    networks:
      edge:
        ipv4_address: 172.30.40.2
    labels:
      - traefik.enable=true
      - traefik.http.middlewares.secure-headers.headers.stsSeconds=31536000
      - traefik.http.middlewares.secure-headers.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.secure-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.secure-headers.headers.frameDeny=true
      - traefik.http.middlewares.secure-headers.headers.referrerPolicy=strict-origin-when-cross-origin
      - traefik.http.middlewares.api-ratelimit.ratelimit.average=20
      - traefik.http.middlewares.api-ratelimit.ratelimit.burst=40

  postgres:
    <<: *restart
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: dentacore
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks: [core]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d dentacore"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    <<: *restart
    image: redis:7-alpine
    command: >
      redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
      --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    networks: [core]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  n8n:
    <<: *restart
    image: docker.n8n.io/n8nio/n8n:latest
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_HOST: n8n.${DOMAIN}
      N8N_PROTOCOL: https
      N8N_PORT: "5678"
      WEBHOOK_URL: https://n8n.${DOMAIN}/
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_SECURE_COOKIE: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      GENERIC_TIMEZONE: Europe/Istanbul
      TZ: Europe/Istanbul
    volumes:
      - n8ndata:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    networks: [edge, core]
    labels:
      - traefik.enable=true
      - traefik.http.routers.n8n.rule=Host(`n8n.${DOMAIN}`)
      - traefik.http.routers.n8n.entrypoints=websecure
      - traefik.http.routers.n8n.middlewares=secure-headers
      - traefik.http.services.n8n.loadbalancer.server.port=5678

  api:
    <<: *restart
    build: ./api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/dentacore
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      PUBLIC_URL: https://api.${DOMAIN}
      # Proxy g?ven s?n?r?: ?n?nde tek proxy (Traefik) var. Traefik varsay?landa istemcinin g?nderdi?i X-Forwarded-*
      # ba?l?klar?n? yok say?p kendisi yazar; XFF'nin SON girdisi ger?ek istemcidir (HOPS=1). ?n?ne CDN eklenirse
      # HOPS=2 yap?n ve Traefik forwardedHeaders.trustedIPs verin. 127.0.0.1 burada i?e yaramaz: Traefik ayr? bir konteynerdir.
      TRUSTED_PROXY: "1"
      TRUSTED_PROXY_HOPS: "1"
      FORWARDED_ALLOW_IPS: "172.30.40.2"
      TZ: Europe/Istanbul
      # Üretim başlangıç doğrulaması (api/app/prodcheck.py) bu değerleri ister; eksikse uygulama açılmaz.
      DC_ENV: production
      WEB_CONCURRENCY: "2"
      # Hasta görselleri varsayılan olarak apidata volume'una (/data/images) yazılır; volume kalıcı olduğu için
      # DC_MEDIA_PERSISTENT=1 bildirimi doğrudur. Nesne depolamaya (S3/R2) geçmek için .env'de MEDIA_BACKEND=s3 ve S3_* verin.
      MEDIA_BACKEND: ${MEDIA_BACKEND:-local}
      IMAGE_DIR: /data/images
      DC_MEDIA_PERSISTENT: "1"
    volumes:
      - apidata:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [edge, core]
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`api.${DOMAIN}`)
      - traefik.http.routers.api.entrypoints=websecure
      - traefik.http.routers.api.middlewares=secure-headers,api-ratelimit
      - traefik.http.services.api.loadbalancer.server.port=8000

  backup:
    <<: *restart
    build: ./backup
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      AGE_RECIPIENT: ${BACKUP_AGE_PUBLIC_KEY}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_MIN_KEEP: ${BACKUP_MIN_KEEP:-3}
      BACKUP_HOUR: ${BACKUP_HOUR:-03}
      BACKUP_MAX_AGE_HOURS: ${BACKUP_MAX_AGE_HOURS:-26}
      BACKUP_OFFHOST_CMD: ${BACKUP_OFFHOST_CMD:-}
      BACKUP_ALERT_CMD: ${BACKUP_ALERT_CMD:-}
      RCLONE_CONFIG: /config/rclone/rclone.conf
      TZ: Europe/Istanbul
    volumes:
      - ./backups:/backups
      - ./rclone:/config/rclone:ro   # BACKUP_OFFHOST_CMD rclone kullaniyorsa: ./rclone/rclone.conf (git'e GIRMEZ)
    depends_on:
      postgres:
        condition: service_healthy
    networks: [core]

  orthanc:
    <<: *restart
    profiles: ["imaging"]
    image: orthancteam/orthanc:latest
    environment:
      ORTHANC__NAME: DentaCorePACS
      ORTHANC__AUTHENTICATION_ENABLED: "true"
      ORTHANC__REGISTERED_USERS: '{"${ORTHANC_USER}": "${ORTHANC_PASSWORD}"}'
      ORTHANC__DICOM_SERVER_ENABLED: "false"
    volumes:
      - orthancdata:/var/lib/orthanc/db
    networks: [core]

networks:
  edge:
    name: dentacore_edge
    ipam:
      config:
        - subnet: 172.30.40.0/24
  core:
    name: dentacore_core
    internal: true

volumes:
  letsencrypt:
  pgdata:
  redisdata:
  n8ndata:
  orthancdata:
  apidata:
