<!doctype html>
<html lang="tr" data-view-mode="desktop">
<head>
<meta charset="utf-8">
<meta id="dc-viewport" name="viewport" content="width=1360, user-scalable=yes">
<title>DentaCore Yönetim Paneli</title>
<link rel="icon" href="data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2216%22%20fill%3D%22%230A2540%22/%3E%3Cpath%20d%3D%22M20%2018c-5%200-8%204-8%2010%200%209%204%2020%208%2020%203%200%203-8%206-12%201-1%202-2%206-2s5%201%206%202c3%204%203%2012%206%2012%204%200%208-11%208-20%200-6-3-10-8-10-4%200-7%202-12%202s-8-2-12-2z%22%20fill%3D%22%230D9488%22/%3E%3Ccircle%20cx%3D%2246%22%20cy%3D%2218%22%20r%3D%225%22%20fill%3D%22%23EA580C%22/%3E%3C/svg%3E" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>/* Hallmark · v2.0.0 · target: DentaCore admin panel (Operate) · surface: clinical precision */
/* Hallmark · pre-emit critique: P5 H5 E5 S5 R5 V5 · unified spacing scale, lifted tokens, non-sticky mobile bar */
/* Kendi sunucumuzdan sunulan medikal tipografi (dış CDN yok, CSP font-src 'self').
   Inter: ekran okunurluğu, açık harf boşlukları, Türkçe ş/ğ/ı/İ tam destek, tablo rakamları.
   Plus Jakarta Sans: sıcak ve güven veren başlık yüzü. */
:root {
  --navy: #0A2540;
  --navy-deep: #06182B;
  --navy-hover: #13385C;
  --teal: #0F766E;
  --teal-mid: #0D9488;
  --teal-bright: #5EEAD4;
  --teal-soft: #CCFBF1;
  --teal-mint: #F0FDF9;
  --teal-ink: #115E59;
  --amber: #C2410C;
  --amber-hover: #9A3412;
  --amber-soft: #FFF7ED;
  --amber-border: #FDBA74;
  --bg-canvas: #F8FAFC;
  --bg-surface: #FFFFFF;
  --bg-subtle: #F1F5F9;
  --ink: #0E1B2E;
  --ink-2: #2D3E52;
  --muted: #46576B;
  --on-dark: #F5F8FC;
  --on-dark-muted: #CBD5E1;
  --on-cta: #FFFFFF;
  --border: #E2E8F0;
  --border-field: #64748B;
  --red: #B91C1C;
  --red-soft: #FEE2E2;
  --red-border: #FCA5A5;
  --green: #15803D;
  --green-soft: #DCFCE7;
  --yellow-ink: #854D0E;
  --yellow-soft: #FEF3C7;
  --dark-badge-border: rgba(255, 255, 255, 0.22);
  --dark-badge-bg: rgba(255, 255, 255, 0.06);
  --dark-nav-hover: rgba(255, 255, 255, 0.08);
  --dark-nav-active: rgba(94, 234, 212, 0.16);
  --dark-line: rgba(255, 255, 255, 0.12);
  --dark-btn-border: rgba(255, 255, 255, 0.25);
  --scrim-modal: rgba(10, 37, 64, 0.48);
  --scrim-drawer: rgba(10, 37, 64, 0.28);
  --scrim-sheet: rgba(10, 37, 64, 0.5);
  --shadow-card: 0 1px 3px rgba(10, 37, 64, 0.05), 0 8px 20px rgba(10, 37, 64, 0.05);
  --shadow-btn: 0 1px 2px rgba(10, 37, 64, 0.08);
  --shadow-btn-cta: 0 4px 12px rgba(15, 118, 110, 0.2);
  --shadow-btn-primary: 0 4px 12px rgba(10, 37, 64, 0.18);
  --shadow-btn-teal: 0 4px 12px rgba(15, 118, 110, 0.2);
  --shadow-modal: 0 24px 64px rgba(10, 37, 64, 0.35);
  --shadow-drawer: -16px 0 48px rgba(10, 37, 64, 0.25);
  --shadow-fab: 0 12px 28px rgba(10, 37, 64, 0.25);
  --shadow-bottom-nav: 0 -4px 16px rgba(10, 37, 64, 0.08);
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --space-1: 8px;
  --space-2: 16px;
  --space-3: 24px;
  --space-4: 32px;
  --space-5: 48px;
  --font-sans: "Inter", "Segoe UI Variable Text", "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, "Noto Sans", "Noto Sans Arabic", "Noto Sans Hebrew", Tahoma, system-ui, sans-serif;
  --font-display: "Plus Jakarta Sans", "Inter", "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, "Noto Sans", Tahoma, system-ui, sans-serif;
  --cta: #0F766E;
  --cta-hover: #115E59;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

*, *::before, *::after {
  box-sizing: border-box;
  -webkit-text-size-adjust: 100%;
  -moz-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

p, li, dd, dt, td, th, label, small, span, div, a, button, input, select, textarea, h1, h2, h3, h4, strong, b {
  max-height: 999999px;
}

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  overflow-x: clip;
  background: var(--bg-canvas);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.65;
  -webkit-text-size-adjust: 100%;
  -moz-text-size-adjust: 100%;
  text-size-adjust: 100%;
  text-rendering: optimizeLegibility;
  font-feature-settings: "cv02", "cv03", "cv04", "cv11";
  caret-color: var(--teal);
  scrollbar-color: var(--border-field) var(--bg-subtle);
  -webkit-font-smoothing: antialiased;
}

/* Başlıklar: güven veren, sakin başlık yüzü */
h1, h2, h3, .brand, .brand-name { font-family: var(--font-display); letter-spacing: -0.01em; }

::selection { background: var(--teal-soft); color: var(--navy); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--teal); }
.hidden { display: none !important; }

h1, h2, h3 {
  letter-spacing: -0.01em;
  line-height: 1.28;
  text-wrap: balance;
  overflow-wrap: break-word;
  min-width: 0;
}

.skip-link {
  position: absolute;
  left: -9999px;
  top: var(--space-1);
  z-index: 120;
  background: var(--navy);
  color: var(--on-cta);
  padding: 12px var(--space-2);
  border-radius: var(--radius-sm);
  font-weight: 700;
  text-decoration: none;
}
.skip-link:focus { left: 12px; }

:focus-visible {
  outline: 3px solid var(--teal);
  outline-offset: 2px;
}
.side :focus-visible, .m-topbar :focus-visible {
  outline-color: var(--teal-bright);
}

/* Login */
.login {
  min-height: 100dvh;
  display: grid;
  grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr);
}
.login-art {
  background: linear-gradient(160deg, var(--navy), var(--navy-deep));
  color: var(--on-dark-muted);
  padding: var(--space-5);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: var(--space-3);
}
.login-art h1 {
  font-size: clamp(1.75rem, 2.8vw, 2.3rem);
  line-height: 1.26;
  margin: 0 0 12px;
  color: var(--on-dark);
  letter-spacing: -0.01em;
}
.login-art p { color: var(--on-dark-muted); max-width: 48ch; margin: 0; }
.badges { display: flex; flex-wrap: wrap; gap: var(--space-1); margin-top: var(--space-3); }
.badge {
  border: 1px solid var(--dark-badge-border);
  background: var(--dark-badge-bg);
  color: var(--on-dark);
  padding: var(--space-1) 12px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 600;
}
.login-form {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--space-3) 20px;
}
.card-login {
  width: 100%;
  max-width: 430px;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: var(--space-3);
  box-shadow: var(--shadow-card);
}
.card-login h2 { margin: 0 0 4px; font-size: 22px; color: var(--navy); }
.card-login .sub { color: var(--muted); margin: 0 0 var(--space-2); font-size: 14.5px; }

.demo-box {
  background: var(--bg-canvas);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 12px;
  margin-bottom: var(--space-2);
}
.demo-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--navy);
  margin-bottom: var(--space-1);
}
.demo-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: var(--space-1);
}
.demo-btn {
  width: 100%;
  min-height: 44px;
  padding: var(--space-1) 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-field);
  background: var(--bg-surface);
  color: var(--navy);
  text-align: left;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  transition: background-color 0.15s ease;
}
.demo-btn:hover { background: var(--teal-soft); }
.demo-btn:active { transform: translateY(1px); }
.demo-btn strong { font-size: 13.5px; display: block; }
.demo-btn span { font-size: 12.5px; color: var(--muted); font-family: var(--font-mono); }

.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
.field label { font-size: 13.5px; font-weight: 650; color: var(--navy); }
.input, select.input, textarea.input {
  min-height: 44px;
  border: 1px solid var(--border-field);
  background: var(--bg-surface);
  border-radius: var(--radius-sm);
  padding: var(--space-1) 12px;
  width: 100%;
  color: var(--ink);
}
textarea.input { min-height: 84px; }

.btn {
  min-height: 44px;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  padding: var(--space-1) var(--space-2);
  font-weight: 650;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: var(--space-1);
  justify-content: center;
  text-decoration: none;
  white-space: nowrap;
  transition: background-color 0.18s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.18s ease, border-color 0.18s ease, transform 0.12s ease;
}
.btn:active { transform: translateY(1px) scale(0.99); }
.btn:disabled { opacity: 0.58; cursor: not-allowed; box-shadow: none; transform: none; }
.btn-cta { background: var(--cta); color: var(--on-cta); box-shadow: var(--shadow-btn); }
.btn-cta:hover { background: var(--cta-hover); box-shadow: var(--shadow-btn-cta); }
.btn-primary { background: var(--navy); color: var(--on-cta); }
.btn-primary:hover { background: var(--navy-hover); box-shadow: var(--shadow-btn-primary); }
.btn-teal { background: var(--teal); color: var(--on-cta); }
.btn-teal:hover { background: var(--teal-ink); box-shadow: var(--shadow-btn-teal); }
.btn-ghost { background: var(--bg-surface); border-color: var(--border-field); color: var(--navy); }
.btn-ghost:hover { background: var(--teal-mint); border-color: var(--teal); color: var(--teal-ink); }
.btn-danger { background: var(--bg-surface); border-color: var(--red-border); color: var(--red); }
.btn-danger:hover { background: var(--red-soft); }
.btn-sm { min-height: 40px; padding: var(--space-1) 12px; font-size: 13px; border-radius: 8px; }
.btn-block { width: 100%; min-height: 44px; }

.err { color: var(--red); font-size: 13.5px; font-weight: 600; min-height: 20px; margin-bottom: var(--space-1); }
.lock-note { display: flex; gap: var(--space-1); align-items: center; color: var(--muted); font-size: 13px; margin-top: 12px; }

/* App Shell */
.shell {
  display: grid;
  grid-template-columns: 256px minmax(0, 1fr);
  min-height: 100dvh;
}
.side {
  background: var(--navy);
  color: var(--on-dark-muted);
  display: flex;
  flex-direction: column;
  padding: var(--space-2) 12px;
  position: sticky;
  top: 0;
  min-height: 100dvh;
  height: auto;
  align-self: stretch;
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 4px 12px var(--space-2);
  color: var(--on-dark);
  font-weight: 750;
}
.brand img { width: 32px; height: 32px; flex: none; }
.brand small { display: block; color: var(--teal-bright); font-weight: 600; font-size: 12px; }
.nav { display: flex; flex-direction: column; gap: 4px; flex: 1; overflow-y: auto; }
.nav a {
  display: flex;
  align-items: center;
  gap: 12px;
  color: var(--on-dark-muted);
  text-decoration: none;
  padding: var(--space-1) 12px;
  min-height: 44px;
  border-radius: var(--radius-sm);
  font-weight: 550;
  font-size: 14.5px;
  transition: background-color 0.15s ease, color 0.15s ease;
}
.nav a:hover { background: var(--dark-nav-hover); color: var(--on-dark); }
.nav a.active {
  background: var(--dark-nav-active);
  color: var(--on-dark);
  box-shadow: inset 3px 0 0 var(--teal-bright);
}
.nav .count {
  margin-left: auto;
  background: var(--cta);
  color: var(--on-cta);
  border-radius: 999px;
  font-size: 12px;
  padding: 0 var(--space-1);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.nav .sep { height: 1px; background: var(--dark-line); margin: var(--space-1); }
.ico {
  width: 18px;
  height: 18px;
  flex: none;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.9;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.me {
  border-top: 1px solid var(--dark-line);
  padding: 12px var(--space-1) 0;
  display: flex;
  align-items: center;
  gap: 12px;
}
.avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--teal);
  color: var(--on-cta);
  display: grid;
  place-items: center;
  font-weight: 700;
  font-size: 13px;
  flex: none;
}
.me .who { flex: 1; min-width: 0; }
.me .who b { display: block; color: var(--on-dark); font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.me .who span { font-size: 12px; color: var(--on-dark-muted); }
.me button {
  min-width: 38px;
  min-height: 38px;
  background: transparent;
  border: 1px solid var(--dark-btn-border);
  color: var(--on-dark);
  border-radius: 8px;
  padding: var(--space-1);
  cursor: pointer;
}
.me button:active { transform: translateY(1px); }

.main {
  padding: var(--space-3) var(--space-4) 84px;
  min-width: 0;
}

.hq-banner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  background: var(--amber-soft);
  border: 1px solid var(--amber-border);
  color: var(--amber-hover);
  border-radius: var(--radius-md);
  padding: 12px var(--space-2);
  margin-bottom: var(--space-2);
  font-weight: 650;
}

.top {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.top h1 { margin: 0; font-size: clamp(1.35rem, 2.2vw, 1.65rem); letter-spacing: -0.015em; color: var(--navy); }
.top p { margin: 4px 0 0; color: var(--muted); max-width: 72ch; }
.actions { display: flex; gap: var(--space-1); flex-wrap: wrap; align-items: center; }

/* Cards & KPIs */
.grid { display: grid; gap: 12px; }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.span-2 { grid-column: span 2; }
.card {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-card);
  padding: 20px;
  min-width: 0;
}
.card-flush { padding: 0; }
.card h3 {
  margin: 0 0 12px;
  font-size: 16px;
  color: var(--navy);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-1);
  flex-wrap: wrap;
}
.kpi .label { color: var(--muted); font-size: 13.5px; font-weight: 650; }
.kpi .value {
  font-size: 28px;
  font-weight: 750;
  color: var(--navy);
  letter-spacing: -0.02em;
  margin-top: var(--space-1);
  font-variant-numeric: tabular-nums;
}
.kpi .hint { color: var(--muted); font-size: 13px; margin-top: 4px; }
.kpi.loss { background: var(--amber-soft); border-color: var(--amber-border); }
.kpi.loss .value { color: var(--amber-hover); }
.kpi.good .value { color: var(--teal); }
.bar { height: 8px; border-radius: 99px; background: var(--bg-subtle); overflow: hidden; margin-top: 12px; }
.bar i { display: block; height: 100%; background: var(--teal); border-radius: 99px; }
.chart { width: 100%; height: 175px; }
.legend { display: flex; gap: 12px; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: var(--space-1); vertical-align: -1px; }

/* Tables */
.table-wrap { overflow-x: auto; max-width: 100%; }
.table { width: 100%; border-collapse: separate; border-spacing: 0; min-width: 560px; }
.table th {
  text-align: left;
  font-size: 13px;
  color: var(--navy);
  font-weight: 700;
  padding: 12px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-canvas);
}
.table td { padding: 12px; border-bottom: 1px solid var(--bg-subtle); vertical-align: middle; }
.table tr.click { cursor: pointer; }
.table tr.click:hover td { background: var(--bg-canvas); }
.table .num { text-align: right; font-variant-numeric: tabular-nums; }
.empty { color: var(--muted); text-align: center; padding: var(--space-4) 12px; }
.error-card {
  background: var(--red-soft);
  border: 1px solid var(--red-border);
  color: var(--red);
  padding: var(--space-2);
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.skeleton {
  height: 120px;
  background: var(--bg-subtle);
  border-radius: var(--radius-md);
  border: 1px solid var(--border);
}

.tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px var(--space-1);
  border-radius: 999px;
  font-size: 12.5px;
  font-weight: 650;
  background: var(--bg-subtle);
  color: var(--ink-2);
  white-space: nowrap;
}
.tag.teal { background: var(--teal-soft); color: var(--teal-ink); }
.tag.red { background: var(--red-soft); color: var(--red); }
.tag.green { background: var(--green-soft); color: var(--green); }
.tag.amber { background: var(--amber-soft); color: var(--amber-hover); border: 1px solid var(--amber-border); }
.tag.yellow { background: var(--yellow-soft); color: var(--yellow-ink); }

/* Calendar: Week + Month */
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: var(--space-1); margin-bottom: var(--space-2); }
.day {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 12px;
  cursor: pointer;
  text-align: left;
  min-height: 62px;
}
.day:active { transform: translateY(1px); }
.day b { display: block; color: var(--navy); font-size: 15px; }
.day span { color: var(--muted); font-size: 12.5px; }
.day.sel { border-color: var(--teal); box-shadow: 0 0 0 2px var(--teal); }
.day .n { float: right; font-weight: 750; color: var(--teal); font-variant-numeric: tabular-nums; }

.month-wrap {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 12px;
  margin-bottom: var(--space-2);
}
.month-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}
.month-title h2 { margin: 0; font-size: 18px; color: var(--navy); }
.month-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: var(--space-1);
}
.month-dow {
  text-align: center;
  font-size: 12.5px;
  font-weight: 700;
  color: var(--muted);
  padding: 4px 0;
}
.mcell {
  min-height: 76px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: var(--space-1);
  background: var(--bg-canvas);
  text-align: left;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.mcell:active { transform: translateY(1px); }
.mcell.out { opacity: 0.52; }
.mcell.sel { border-color: var(--teal); background: var(--bg-surface); box-shadow: 0 0 0 2px var(--teal); }
.mcell-head { display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 700; color: var(--navy); }
.mcell-cnt { background: var(--teal-soft); color: var(--teal-ink); border-radius: 999px; padding: 0 var(--space-1); font-size: 11.5px; font-weight: 700; }

.slot {
  display: grid;
  grid-template-columns: 82px minmax(0, 1fr) auto;
  gap: 12px;
  align-items: center;
  padding: 12px var(--space-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--bg-surface);
  margin-bottom: var(--space-1);

.slot.cancelled { opacity: 0.58; }
.slot .t { font-weight: 750; color: var(--navy); font-size: 16px; font-variant-numeric: tabular-nums; }
.slot .t small { display: block; color: var(--muted); font-weight: 550; font-size: 12px; }
.slot .p b { color: var(--ink); }
.slot .p div { color: var(--muted); font-size: 13.5px; }

/* AI Simulator & RTL */
.sim-card {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-card);
  padding: 20px;
  margin-bottom: var(--space-2);
}
.sim-presets { display: flex; flex-wrap: wrap; gap: var(--space-1); margin-bottom: 12px; }
.sim-form-row {
  display: grid;
  grid-template-columns: 220px minmax(0, 1fr) auto;
  gap: 12px;
  align-items: end;
}
.sim-reply {
  margin-top: 12px;
  border: 1px solid var(--border);
  background: var(--bg-canvas);
  border-radius: var(--radius-md);
  padding: 12px var(--space-2);
}
.sim-reply-head {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-1);
  margin-bottom: 12px;
  direction: ltr;
}
.sim-reply-text {
  font-size: 15.5px;
  color: var(--navy);
  font-weight: 550;
  line-height: 1.55;
  margin: 0;
  unicode-bidi: plaintext;
}
.sim-reply-text[dir="rtl"] {
  text-align: right;
  font-size: 16.5px;
  unicode-bidi: isolate;
}

/* Handoff & Ecosystem Cards */
.handoff-box {
  background: var(--bg-canvas);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 12px;
  margin-bottom: 12px;
}
.handoff-box pre {
  margin: 0;
  white-space: pre-wrap;
  word-break: break-word;
  font-family: var(--font-mono);
  font-size: 12.5px;
  color: var(--ink);
  line-height: 1.55;
}
.eco-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
  margin-bottom: 12px;
}
.eco-item {
  border: 1px solid var(--border);
  background: var(--bg-canvas);
  border-radius: var(--radius-sm);
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.eco-item strong { color: var(--navy); font-size: 14px; }
.eco-item small { color: var(--muted); font-size: 12.5px; word-break: break-all; }

/* Modals, Drawers, Toasts */
.overlay {
  position: fixed;
  inset: 0;
  background: var(--scrim-modal);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 60;
  padding: var(--space-2);
}
.modal {
  background: var(--bg-surface);
  border-radius: var(--radius-lg);
  width: 100%;
  max-width: 560px;
  box-shadow: var(--shadow-modal);
  padding: var(--space-3);
  max-height: 92dvh;
  overflow-y: auto;
}
.modal h2 { margin: 0 0 12px; color: var(--navy); font-size: 19px; }
.modal .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.modal .foot { display: flex; justify-content: flex-end; gap: var(--space-1); margin-top: 12px; }

.drawer-wrap > .overlay {
  z-index: 54;
  background: var(--scrim-drawer);
}
.drawer {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  width: min(560px, 100%);
  background: var(--bg-surface);
  box-shadow: var(--shadow-drawer);
  z-index: 55;
  overflow-y: auto;
  padding: var(--space-3);
}
.drawer h2 { margin: 0; color: var(--navy); }
.drawer .table { min-width: 0; }
.kv { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: var(--space-1) 12px; margin: 12px 0; }
.kv span { color: var(--muted); }
.section-t { margin: 20px 0 var(--space-1); font-size: 13.5px; color: var(--navy); font-weight: 700; }

.toast {
  position: fixed;
  bottom: var(--space-3);
  left: 50%;
  transform: translateX(-50%);
  background: var(--navy);
  color: var(--on-cta);
  padding: 12px 20px;
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-card);
  z-index: 90;
  font-weight: 650;
  max-width: calc(100% - var(--space-4));
}
.toast.bad { background: var(--red); }

.search { max-width: 300px; }
.alert-item { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid var(--bg-subtle); flex-wrap: wrap; }
.alert-item:last-child { border-bottom: 0; }
.alert-item .k { flex: none; }
.alert-item .d { flex: 1; min-width: 180px; }
.alert-item .d small { display: block; color: var(--muted); }
.mono { font-family: var(--font-mono); font-size: 12.5px; }
.secret {
  background: var(--bg-subtle);
  border: 1px dashed var(--border-field);
  border-radius: var(--radius-sm);
  padding: 12px;
  font-family: var(--font-mono);
  letter-spacing: 0.12em;
  word-break: break-all;
  color: var(--navy);
  font-weight: 700;
}
.chain-ok { color: var(--green); font-weight: 700; }
.chain-bad { color: var(--red); font-weight: 700; }
.idle {
  position: fixed;
  top: 12px;
  right: 12px;
  background: var(--amber-soft);
  border: 1px solid var(--amber-border);
  color: var(--amber-hover);
  border-radius: var(--radius-md);
  padding: 12px var(--space-2);
  z-index: 80;
  box-shadow: var(--shadow-card);
  font-weight: 650;
}
.cal-box {
  background: var(--bg-canvas);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 12px;
  margin-bottom: 12px;
}
.cal-box code {
  display: block;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  padding: var(--space-1) 12px;
  border-radius: var(--radius-sm);
  word-break: break-all;
  margin: var(--space-1) 0;
  font-size: 12.5px;
}
.side-asst {
  margin: var(--space-1) 4px 12px;
  background: var(--teal);
  color: var(--on-cta);
  border: 0;
  width: calc(100% - 8px);
}
.side-asst:hover { background: var(--teal-ink); }
.m-topbar-actions {
  display: flex;
  align-items: center;
  gap: var(--space-1);
  flex: none;
}
.asst-ans {
  background: var(--bg-canvas);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px;
  white-space: pre-wrap;
  margin-top: 12px;
  font-size: 14px;
  min-height: 72px;
}

/* FDI Odontogram Interactive Chart */
.odo-box {
  margin-top: var(--space-2);
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--bg-canvas);
}
.odo-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-1);
  flex-wrap: wrap;
  margin-bottom: 12px;
}
.odo-head strong {
  display: block;
  font-size: 13.5px;
  color: var(--navy);
}
.odo-head small {
  color: var(--muted);
  font-size: 12px;
}
.odo-arch-wrap {
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
}
.odo-row {
  display: grid;
  grid-template-columns: repeat(8, minmax(0, 1fr));
  gap: 4px;
}
.odo-row.odo-pedo {
  grid-template-columns: repeat(5, minmax(0, 1fr));
}
.odo-tooth {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  padding: 4px 2px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--bg-surface);
  cursor: pointer;
  min-height: 48px;
  transition: transform 0.15s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.odo-tooth:hover {
  transform: translateY(-2px);
  border-color: var(--teal);
  background: var(--teal-mint);
}
.odo-tooth.has-rec {
  border-color: var(--teal);
  background: var(--teal-soft);
}
.odo-svg {
  width: 26px;
  height: 26px;
  flex: none;
}
.odo-num {
  font-size: 11px;
  font-weight: 700;
  color: var(--navy);
  font-variant-numeric: tabular-nums;
}
.odo-check-row {
  display: flex;
  align-items: center;
  gap: var(--space-1);
  font-size: 13.5px;
  color: var(--ink-2);
  margin: var(--space-1) 0;
  cursor: pointer;
}
.odo-check-row input {
  width: 18px;
  height: 18px;
  accent-color: var(--teal);
  flex: none;
}

/* Mobile Topbar + Bottom Nav */
.m-topbar { display: none; }
.m-bottom-nav { display: none; }
.m-more-sheet {
  position: fixed;
  inset: 0;
  z-index: 70;
  background: var(--scrim-sheet);
  display: flex;
  align-items: flex-end;
}
.m-more-panel {
  background: var(--bg-surface);
  width: 100%;
  max-height: 82dvh;
  overflow-y: auto;
  border-radius: 16px 16px 0 0;
  padding: 20px var(--space-2) calc(20px + env(safe-area-inset-bottom, 0px));
}
.m-more-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--space-1);
  margin-top: 12px;
}
.m-more-grid a {
  display: flex;
  align-items: center;
  gap: var(--space-1);
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--navy);
  font-weight: 650;
  font-size: 14px;
  text-decoration: none;
  min-height: 44px;
}
.m-more-grid a.active { background: var(--teal-soft); border-color: var(--teal); color: var(--teal-ink); }

@media (max-width: 1px) {
  .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g3, .eco-grid { grid-template-columns: 1fr; }

}

@media (max-width: 1px) {
  .login { grid-template-columns: 1fr; }
  .login-art { display: none; }
  .shell { grid-template-columns: 1fr; }
  .side { display: none; }
  .m-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: var(--navy);
    color: var(--on-dark);
    padding: 12px var(--space-2);
  }
  .m-topbar-brand { display: flex; align-items: center; gap: var(--space-1); min-width: 0; }
  .m-topbar-brand img { width: 28px; height: 28px; flex: none; }
  .m-topbar-brand div { min-width: 0; }
  .m-topbar-brand strong { display: block; font-size: 15px; color: var(--on-dark); }
  .m-topbar-brand small { display: block; font-size: 12px; color: var(--teal-bright); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
  .main { padding: var(--space-2) var(--space-2) 96px; }
  .g2, .modal .row, .sim-form-row { grid-template-columns: 1fr; }
  .week { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .slot { grid-template-columns: 1fr; gap: var(--space-1); }
  .mcell { min-height: 52px; padding: 4px; }
  .mcell-item { display: none; }
  .m-bottom-nav {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 45;
    background: var(--bg-surface);
    border-top: 1px solid var(--border);
    padding: 4px 4px calc(4px + env(safe-area-inset-bottom, 0px));
    box-shadow: var(--shadow-bottom-nav);
  }
  .m-bottom-nav a, .m-bottom-nav button {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;

    font-weight: 650;
    padding: 4px;
    cursor: pointer;
    border-radius: 8px;
  }
  .m-bottom-nav a.active, .m-bottom-nav button.active {
    color: var(--teal);
    background: var(--teal-soft);
  }
  .toast { bottom: 76px; }
}

@media (min-width: 821px) and (max-height: 700px) {
  .side { padding: var(--space-1) 12px; }
  .brand { padding: 4px 12px var(--space-1); }
  .nav { gap: 4px; }
  .nav a { min-height: 36px; padding: 4px 12px; font-size: 13.5px; }
  .side-asst { min-height: 36px; padding: var(--space-1) 12px; margin-top: var(--space-1); font-size: 13px; }
  .me { padding-top: var(--space-1); }
}

@media (max-width: 1px) {
  .g4 { grid-template-columns: 1fr; }
  .btn { white-space: normal; text-align: center; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition-duration: 0.01ms !important;
    animation-duration: 0.01ms !important;
  }
}

tçenize en uygun ödeme planını birlikte oluşturuyoruz.","en":"We offer flexible payment options for our patients, including cash, bank transfer, and major credit card installments, tailored to your treatment plan after consultation.","de":"Bar- und Kartenzahlung sind möglich.","ar":"نقبل الدفع نقداً وبالبطاقة.","ru":"Принимаем наличные и банковские карты.","fr":"Les paiements en espèces et par carte bancaire sont acceptés.","nl":"Contante betaling en creditcards worden geaccepteerd.","es":"Aceptamos pagos en efectivo y con tarjeta de crédito.","it":"Accettiamo pagamenti in contanti e con carta di credito.","fa":"پرداخت نقدی و کارت بانکی پذیرفته می‌شود.","az":"Nağd və bank kartı ilə ödəniş qəbul edilir.","uk":"Приймаємо готівку та банківські картки.","bg":"Приемаме плащане в брой и с банкова карта.","ro":"Acceptăm plata în numerar și cu cardul bancar.","el":"Δεχόμαστε μετρητά και πιστωτικές/χρεωστικές κάρτες.","he":"אנו מקבלים תשלום במזומן ובכרטיס אשראי."}},"agri_korku":{"patterns":{"tr":"(agrir mi|aci (verir|hisseder) mi(yim)?|canim acir mi|igne korku(su|m)|disci korku(su|m)|uyutarak|sedasyon|anestezi|uyusturma|korkum var)","en":"(does it hurt|painful|dental phobia|fear of dentist|sedation|anesthesia|numb)","de":"(tut es weh|schmerzen|zahnarztangst|sedierung|betaubung|narkose)","ar":"(هل يؤلم|بدون ألم|تخدير|خوف من الأسنان|بنج)","ru":"(больно ли|без боли|седация|анестезия|боюсь стоматолога)","fr":"(est.?ce douloureux|sans douleur|anesthesie|peur du dentiste|sedation)","nl":"(bang voor de tandarts|tandartsangst|doet.{0,24}pijn|pijnlijk|sedatie|verdoving|anesthesie|narcose)","es":"(duele|sin dolor|miedo al dentista|fobia dental|sedacion|anestesia)","it":"(fa male|senza dolore|paura del dentista|sedazione|anestesia)","fa":"(آیا درد دارد|بدون درد|ترس از دندانپزشکی|بیهوشی|بی حسی|سدیشن)","az":"(agriyir|agri verir|dis hekimi qorxusu|iyne qorxusu|sedasiya|anesteziya|keyitme)","uk":"(чи боляче|без болю|седація|анестезія|боюся стоматолога)","bg":"(боли ли|без болка|седация|анестезия|страх от зъболекар)","ro":"(doare|fara durere|frica de dentist|sedare|anestezie)","el":"(πονάει|ποναει|φόβος για τον οδοντίατρο|αναισθησία|αναισθησια|μέθη)","he":"(האם זה כואב|ללא כאב|פחד מרופא שיניים|טשטוש|הרדמה מקומית|סדציה)"},"answers":{"tr":"Merhabalar, bu hassasiyetinizi bizimle paylaştığınız için çok teşekkür ederiz; kliniğimizde sizi çok iyi anlıyoruz. İğne ve diş hekimi korkusu olan misafirlerimizde işlem öncesinde özel yüzey uyuşturucu jel kullanıyor, modern lokal anestezi ve sedasyon (uyutarak tedavi) destekli konfor protokolümüzle hiçbir ağrı hissetmeden çok sakin bir süreç geçirmenizi sağlıyoruz. Dilerseniz ilk gelişinizde hiçbir işlem yapmadan, sadece hekimimizle tanışma ve ön değerlendirme randevusu oluşturalım mı?","en":"Thank you for sharing your concern with us; we completely understand dental anxiety. We use topical numbing gel prior to modern local anesthesia and offer sedation dentistry options so your treatment is completely calm and pain-free. Would you like to schedule a gentle, no-pressure initial consultation with our doctor?","de":"Vielen Dank für Ihr Vertrauen – wir verstehen Zahnarztangst sehr gut. Mit oberflächlichem Betäubungsgel, moderner Lokalanästhesie und optionaler Sedierung gestalten wir Ihre Behandlung völlig schmerzfrei und entspannt. Möchten Sie zunächst einen unverbindlichen Kennenlerntermin vereinbaren?","ar":"شكراً لمشاركتكم هذا القلق معنا؛ نحن نتفهم خوفكم تماماً. نطبق بروتوكول راحة خاصاً يشمل جل تخدير سطحي وتخديراً موضعياً حديثاً وخيارات التهدئة (التركين) لضمان علاج هادئ وبدون أي ألم. هل نرتب لكم موعداً استشارياً أولياً؟","ru":"Спасибо, что поделились своими переживаниями — мы прекрасно понимаем страх перед стоматологом. Мы используем аппликационный гель, современную местную анестезию и седацию, чтобы лечение прошло абсолютно безболезненно и спокойно. Хотите записаться на первичную ознакомительную консультацию?","fr":"Merci de nous confier votre appréhension ; nous comprenons parfaitement la peur du dentiste. Grâce à notre protocole confort sous anesthésie locale moderne et sédation, vos soins se déroulent sans aucune douleur et en toute sérénité. Souhaitez-vous planifier une première visite de rencontre ?","nl":"Hartelijk dank dat u dit met ons deelt; wij begrijpen angst voor de tandarts heel goed. Met verdovende voorgel, moderne lokale verdoving en sedatie zorgen wij voor een volledig pijnloze en ontspannen behandeling. Zullen we een rustig kennismakingsgesprek inplannen?","es":"Todos los tratamientos se realizan con anestesia local moderna para que no sienta dolor. También ofrecemos opciones de sedación para pacientes con ansiedad dental. ¿Desea agendar una consulta?","it":"Tutti i trattamenti vengono eseguiti in anestesia locale moderna senza dolore. Offriamo anche opzioni confortevoli e sedazione per chi ha paura del dentista. Vuole prenotare una visita?","fa":"تمامی درمان‌ها با بی‌حسی موضعی پیشرفته و بدون درد انجام می‌شوند. برای بیماران دارای اضطراب دندانپزشکی، روش‌های درمانی آرام و تحت نظر پزشک فراهم است. آیا مایلید نوبت معاینه ثبت کنیم؟","az":"Bütün prosedurlar müasir lokal anesteziya altında ağrısız həyata keçirilir. Diş həkimi qorxusu (fobiyası) olan pasiyentlərimiz üçün həkim nəzarətində rahat müalicə və sedasiya seçimlərimiz mövcuddur. Müayinə görüşü təyin edəkmi?","uk":"Усі процедури проводяться під сучасною місцевою анестезією без болю та дискомфорту. Для пацієнтів із фобією доступні комфортні методи лікування. Бажаєте записатися на консультацію?","bg":"Всички процедури се извършват под съвременна локална анестезия без болка. За пациенти със страх от зъболекар предлагаме щадящи методи и седация. Желаете ли час за преглед?","ro":"Toate procedurile se realizează sub anestezie locală modernă, fără durere. Pentru pacienții cu anxietate dentară oferim opțiuni confortabile sub supravegherea medicului. Doriți o programare?","el":"Όλες οι θεραπείες πραγματοποιούνται με σύγχρονη τοπική αναισθησία χωρίς πόνο. Για ασθενείς με οδοντιατρικό άγχος προσφέρουμε άνετες επιλογές. Θέλετε να κλείσουμε ραντεβού;","he":"כל הטיפולים מתבצעים תחת הרדמה מקומית מתקדמת ללא כאב. למטופלים עם חרדה دנטלית אנו מציעים אפשרויות טיפול רגועות ונוחות. האם לתאם תור לבדיקה?"}},"tedavi_sure":{"patterns":{"tr":"(kac gun surer|zirkonyum kac gun|iyilesme suresi|tedavi suresi|toplam kac gun)","en":"(how many days|how long does it take|how many visits|implant duration|zirconia days|recovery time)","de":"(wie viele tage|wie lange dauert|behandlungsdauer|implantat dauer|zirkon dauer)","ar":"(كم يوم|مدة العلاج|كم جلسة|مدة الزراعة|مدة الزيركون)","ru":"(сколько дней|сколько длится|сроки лечения|сколько визитов)","fr":"(combien de jours|duree du traitement|combien de seances)","nl":"(hoeveel dagen|hoe lang duurt|behandelduur|herstelltijd)","es":"(cuantos dias|cuanto dura el tratamiento|tiempo de recuperacion)","it":"(quanti giorni|quanto dura il trattamento|tempi di recupero)","fa":"(چند روز طول می|مدت درمان|طول درمان|چند روزه)","az":"(nece gun cekir|mualice muddeti|sagalmasi nece gun)","uk":"(скільки днів триває|термін лікування|скільки часу займає)","bg":"(колко дни продължава|срок на лечение|времетраене на лечението)","ro":"(cate zile dureaza|durata tratamentului|timp de recuperare)","el":"(πόσες μέρες διαρκεί|ποσες μερες|διάρκεια θεραπείας)","he":"(כמה ימים נמשך|משך הטיפול|זמן החלמה)"},"answers":{"tr":"Merhabalar, tedavi süremiz size özel yapılacak klinik planlamaya göre şekilleniyor. Tek seanslık işlemleri aynı gün tamamlıyoruz; zirkonyum kaplama ve dijital gülüş tasarımı süreçlerimiz ise provalarla birlikte ortalama 4 ile 6 gün sürüyor. İmplant tedavi takvimini ise hekimimiz muayene ve röntgen kontrolünüzde netleştiriyor. Size özel tedavi takviminizi çıkarmamız için ön değerlendirme randevusu oluşturalım mı?","en":"Hello, your treatment timeline is carefully tailored to your clinical plan: single-visit procedures are completed the same day, zirconia crowns and digital smile design take an average of 4 to 6 days including fittings, and implant schedules are finalized by our specialist after an X-ray evaluation. Shall we book a consultation to prepare your personalized schedule?","de":"Die Behandlungsdauer richtet sich nach Ihrem individuellen Befund: Einzelbehandlungen erfolgen am selben Tag, Zirkonkronen und Smile-Design dauern inklusive Anproben etwa 4 bis 6 Tage, und den Zeitplan für Implantate legt unser Fachzahnarzt nach der Röntgenanalyse fest. Sollen wir einen Beratungstermin vereinbaren?","ar":"تختلف مدة العلاج حسب الحالة؛ تصميم الابتسامة والزيركون يستغرق عادة من 4 إلى 6 أيام، وتحدد خطة الزراعة بعد فحص الطبيب للأشعة.","ru":"Сроки зависят от плана лечения: циркониевые коронки и дизайн улыбки обычно занимают 4–6 дней, а план имплантации составляется врачом после осмотра или снимка.","fr":"La durée dépend du plan clinique : le zircone et le sourire prennent généralement 4 à 6 jours, et le calendrier implantaire est fixé après examen radio.","nl":"De behandelduur hangt af van uw klinisch plan: zirkonium en smile design duren gemiddeld 4 tot 6 dagen, terwijl implantaten na röntgenonderzoek worden gepland.","es":"La duración depende del plan clínico: el zirconio y diseño de sonrisa toman de 4 a 6 días, y los implantes se planifican tras la valoración radiográfica.","it":"La durata dipende dal piano clinico: zirconio e smile design richiedono circa 4-6 giorni, mentre gli impianti vengono pianificati dopo la visita.","fa":"مدت درمان به طرح بالینی بستگی دارد: روکش زیرکونیوم و طراحی لبخند معمولاً ۴ تا ۶ روز زمان می‌برد و زمان‌بندی ایمپلنت پس از معاینه پزشک مشخص می‌شود.","az":"Müalicə müddəti klinik plana görə dəyişir: zirkon və təbəssüm dizaynı ortalama 4-6 gün çəkir, implant təqvimi isə həkim müayinəsindən sonra dəqiqləşir.","uk":"Тривалість залежить від плану лікування: цирконієві коронки та дизайн усмішки займають 4–6 днів, а графік імплантації визначається після огляду.","bg":"Продължителността зависи от клиничния план: циркониевите коронки отнемат 4–6 дни, а имплантите се планират след преглед от лекар.","ro":"Durata tratamentului depinde de planul clinic: coroanele din zirconiu durează în medie 4-6 zile, iar implanturile se planifică după consultație.","el":"Η διάρκεια εξαρτάται από το κλινικό πλάνο: οι θήκες ζιρκονίου διαρκούν 4-6 ημέρες, ενώ τα εμφυτεύματα προγραμματίζονται μετά από εξέταση.","he":"משך הטיפול תלוי בתוכנית הקלינית: כתרי זירקוניה ועיצוב חיוך אורכים לרוב 4–6 ימים, ולוח הזמנים להשתלה נקבע לאחר בדיקת רופא."}},"cocuk_dis":{"patterns":{"tr":"(cocuk dis|pedodonti|oglumun disi|oglumun sut disi|kizimin disi|sut disi|bebek dis|cocugumun disi)","en":"(pediatric dentist|kids dental|child tooth|my son tooth|my daughter tooth|baby teeth)","de":"(kinderzahnarzt|milchzahn|kinderbehandlung)","ar":"(أسنان الأطفال|طبيب أطفال|أسنان لبنية)","ru":"(детский стоматолог|молочный зуб|ребенку зуб)","fr":"(dentiste pediatrique|dent de lait|enfant dentiste|pedodontie)","nl":"(kindertandarts|melktand|kind gebit)","es":"(odontopediatria|dentista infantil|diente de leche|nino diente)","it":"(dentista pediatrico|pedodonzia|dente da latte|bambino dentista)","fa":"(دندانپزشک کودکان|دندان شیری|دندان بچگانه|اطفال)","az":"(usaq dis|pedodontiya|sud disi|oglumun disi|qizimin disi)","uk":"(дитячий стоматолог|молочний зуб|дитині зуб)","bg":"(детски зъболекар|млечен зъб|дете зъб)","ro":"(stomatolog pediatru|pedodontie|dinte de lapte|copil dentist)","el":"(παιδοδοντίατρος|παιδοδοντιατρος|νεογιλό δόντι|δόντι παιδιού)","he":"(רופא שיניים לילדים|שן חלב|שיני חלב|טיפול שיניים לילדים)"},"answers":{"tr":"Merhabalar, çocuk diş hekimimiz (pedodonti uzmanımız) minik misafirlerimizle hiç korkutmayan, oyunlaştırılmış ve koruyucu bir yaklaşımla özel olarak ilgileniyor. Çocuğunuzun kliniğimizi sevmesi ve konforlu bir muayene geçirmesi için size uygun günü paylaşırsanız uzman hekimimize hemen öncelikli randevu planlayabiliriz.","en":"Hello, our specialist pediatric dentist (pedodontist) cares for our young guests with a gentle, playful, and fear-free preventive approach. Please share a preferred day so we can arrange a comfortable priority visit for your child.","de":"Ja, wir bieten einfühlsame Kinderzahnheilkunde in ruhiger Atmosphäre an. Teilen Sie uns gerne das Alter Ihres Kindes für einen Termin mit.","ar":"نعم، نقدم رعاية أسنان لطيفة ومخصصة للأطفال في بيئة مريحة. يرجى مشاركة عمر الطفل لتحديد موعد مناسب.","ru":"Да, в нашей клинике ведется бережный детский стоматологический прием. Напишите возраст ребенка, чтобы мы подобрали удобное время.","fr":"Oui, nous proposons des soins dentaires pédiatriques doux et adaptés aux enfants. Indiquez l'âge de votre enfant pour planifier un rendez-vous.","nl":"Ja, wij bieden kindvriendelijke tandheelkundige zorg (pedodontie) in een rustige omgeving. Deel de leeftijd van uw kind om een afspraak in te plannen.","es":"Sí, ofrecemos odontopediatría amable y adaptada a los niños. Comparta la edad de su hijo para programar una cita.","it":"Sì, offriamo cure odontoiatriche pediatriche delicate per i bambini. Ci indichi l'età del bambino per fissare un appuntamento.","fa":"بله، در کلینیک ما خدمات دندانپزشکی کودکان (پدودنتیکس) در محیطی آرام ارائه می‌شود. لطفاً سن کودک را برای هماهنگی نوبت بفرمایید.","az":"Bəli, klinikamızda uşaq pasiyentlər (pedodontiya) üçün yaş qrupuna uyğun qoruyucu müalicə tətbiq olunur. Uşağın yaşını yazsanız uyğun görüş təyin edə bilərik.","uk":"Так, у нашій клініці проводиться дбайливий дитячий стоматологічний прийом. Напишіть вік дитини для запису.","bg":"Да, предлагаме внимателна детска стоматологична грижа. Споделете възрастта на детето, за да запишем подходящ час.","ro":"Da, oferim tratamente stomatologice pediatrice blânde pentru copii. Scrieți vârsta copilului pentru o programare.","el":"Ναι, παρέχουμε φιλική παιδοδοντιατρική φροντίδα. Πείτε μας την ηλικία του παιδιού για να κλείσουμε ραντεβού.","he":"כן, אנו מעניקים טיפולי שיניים עדינים ומותאמים לילדים. שתפו את גיל הילד ונתאם תור מתאים."}},"sigorta_taksit":{"patterns":{"tr":"(ozel saglik sigorta(si)?|tamamlayici sigorta|anlasmali kurum|anlasmali sigorta|kac taksit|taksit (oluyor|yapiyor|imkani|var) (mu|mi)|banka anlasmasi|allianz)","en":"(dental insurance|private insurance|installment plan|payment plan|insurance coverage)","de":"(zahnzusatzversicherung|ratenzahlung|krankenkasse|kostenubernahme)","ar":"(تأمين طبي|تأمين الأسنان|تقسيط|دفعات)","ru":"(страховка|рассрочка|оплата частями)","fr":"(assurance dentaire|mutuelle|paiement en plusieurs fois|echelonnement)","nl":"(tandartsverzekering|zorgverzekering|betaling in termijnen|gespreid betalen)","es":"(seguro dental|seguro medico|pago a plazos|cuotas)","it":"(assicurazione dentale|pagamento a rate|rateizzazione)","fa":"(بیمه تکمیلی|بیمه دندانپزشکی|اقساط|قسطی)","az":"(tibbi sigorta|sigorta kecerlidir|taksit|hisse-hisse odenis)","uk":"(страховка|страхування|розстрочка|оплата частинами)","bg":"(здравна застраховка|разсрочено плащане|на вноски)","ro":"(asigurare medicala|asigurare dentara|plata in rate)","el":"(ιδιωτική ασφάλιση|ασφαλεια|δόσεις|δοσεις)","he":"(ביטוח שיניים|ביטוח בריאות|תשלומים|פריסת תשלומים)"},"answers":{"tr":"Merhabalar, kliniğimizde kredi kartlarına taksit kolaylığı sağlıyor; özel sağlık sigortası ve anlaşmalı kurumlar için poliçenizin gerektirdiği tüm tanı, röntgen ve fatura evraklarını eksiksiz hazırlıyoruz. Poliçenizin kapsamını veya kartınıza uygun taksit seçeneklerini sizin için hemen kontrol etmemiz adına telefon numaranızı veya uygun olduğunuz saati paylaşabilir misiniz?","en":"Hello, we offer flexible credit card installment plans and prepare all required diagnostic, X-ray, and invoice documentation for private health insurance policies. Feel free to share your phone number or preferred time so our coordinator can review your coverage options.","de":"Wir unterstützen gängige Kreditkarten sowie flexible Zahlungsoptionen und stellen alle erforderlichen Unterlagen für Ihre Zahnzusatzversicherung bereit.","ar":"ندعم بطاقات الائتمان وخيارات التقسيط، ونوفر كافة التقارير والفواتير الطبية اللازمة لشركات التأمين.","ru":"Мы принимаем банковские карты, предлагаем удобные варианты оплаты и оформляем все медицинские документы для страховых компаний.","fr":"Nous acceptons les cartes bancaires, proposons des facilités de paiement et fournissons tous les justificatifs médicaux pour votre assurance ou mutuelle.","nl":"Wij ondersteunen creditcards, termijnbetalingen en leveren alle medische documentatie en facturen voor uw tandartsverzekering.","es":"Aceptamos tarjetas de crédito, opciones de pago en cuotas y entregamos toda la documentación médica para su seguro dental.","it":"Supportiamo carte di credito, pagamenti rateali e forniamo tutta la documentazione medica per la vostra assicurazione.","fa":"در کلینیک ما امکان پرداخت با کارت بانکی، شرایط اقساط و ارائه کامل مدارک پزشکی برای بیمه‌های تکمیلی فراهم است.","az":"Klinikamızda bank kartları ilə taksit imkanları və özəl tibbi sığorta sənədləşməsi mövcuddur. Ətraflı məlumat üçün əlaqə nömrənizi qeyd edə bilərsiniz.","uk":"Ми приймаємо банківські картки, пропонуємо зручні умови оплати та оформлюємо всі медичні документи для страхових компаній.","bg":"Поддържаме плащане с карти, гъвкави схеми на изплащане и издаваме пълна медицинска документация за застрахователи.","ro":"Acceptăm carduri bancare, opțiuni de plată în rate și eliberăm documentația medicală completă pentru asigurări.","el":"Υποστηρίζουμε πληρωμές με κάρτα, ευέλικτες δόσεις και παρέχουμε πλήρη ιατρικά παραστατικά για την ασφάλειά σας.","he":"אנו תומכים בכרטיסי אשראי, פריסת תשלומים ומספקים את כל המסמכים והחשבוניות הרפואיות עבור חברות הביטוח."}}},"emergency":{"patterns":{"tr":"(kanama (durmuyor|dinmiyor|kesilmiyor|cok fazla)|kanma durmuyo|yuz(um)? (cok )?sis|yuz.{0,12}sis|bogaz.{0,12}sis|nefes alam|yutkunam|ates(im)? (var|yuksek|cikti)|39 derece|dis(im)? (kirildi|dustu|yerinden cikti)|kaza gecird|darbe ald)","en":"(bleeding (won'?t|doesn'?t|does not|will not) stop|face (is )?swollen|swelling (in|on) my (face|throat)|can'?t (breathe|swallow)|high fever|knocked out (a |my )?tooth|accident)","de":"(blutung (hort nicht|stoppt nicht)|gesicht.{0,10}geschwollen|schwellung|atemnot|kann nicht schlucken|hohes fieber|zahn ausgeschlagen|unfall)","ar":"(نزيف (لا يتوقف|مستمر)|تورم (الوجه|الحلق)|صعوبة في التنفس|لا أستطيع البلع|حمى|سقط سني)","ru":"(кровотечение не (останавлива|прекраща)|опухло лицо|отек (лица|горла)|не могу (дышать|глотать)|высокая температура|выбил зуб)","fr":"(saignement ne s arrete pas|visage gonfle|du mal a respirer|du mal a avaler|fievre elevee|dent cassee)","nl":"(bloeding stopt niet|gezicht.{0,12}gezwollen|zwelling in (gezicht|keel)|kan niet (ademen|slikken)|hoge koorts|tand uitgevallen)","es":"(sangrado no para|cara hinchada|no puedo (respirar|tragar)|fiebre alta|diente roto)","it":"(sanguinamento non si ferma|viso gonfio|non riesco a (respirare|deglutire)|febbre alta|dente rotto)","fa":"(خونریزی.{0,25}(بند نمی|قطع نمی|متوقف نمی)|خونریزی دندانم|صورتم ورم|ورم (صورت|گلو)|نفس نمی|نمی.{0,5}توانم نفس|بلع|تب شدید)","az":"(qanaxma (dayanmir|kesilmir)|uz(um)? sis(ib)?|bogaz(im)? sis(ib)?|nefes ala bilmir(em)?|uda bilmir(em)?|yuksek qizdirma|tecili komek)","uk":"(кровотеча не зупиняється|обличчя набрякло|набряк (обличчя|горла)|не можу (дихати|ковтати)|висока температура)","bg":"(кървенето не спира|лицето ми отече|оток на (лицето|гърлото)|не мога да (дишам|преглъщам)|висока температура)","ro":"(sangerarea nu se opreste|fata umflata|nu pot (respira|inghiti)|febra mare|dinte spart)","el":"(αιμορραγία δεν σταματά|πρησμένο πρόσωπο|δεν μπορώ να (αναπνεύσω|καταπιώ)|υψηλός πυρετός)","he":"(הדימום לא מפסיק|הפנים נפוחות|נפיחות בפנים|קושי בנשימה|לא יכול לבלוע|חום גבוה)"},"answers":{"tr":"Çok geçmiş olsun; belirttiğiniz durum acil tıbbi değerlendirme gerektirebilir. Lütfen vakit kaybetmeden 112'yi arayın veya en yakın acil servise başvurun. Nöbetçi hekimimize de acil koduyla bilgi verildi; klinik doğrudan hattımız: {telefon}","en":"We are very sorry you are going through this; your symptoms require urgent medical care. Please call 112 or go to the nearest emergency department immediately. Our on-call dentist has also been notified; clinic line: {telefon}","de":"Das kann dringend sein. Bitte rufen Sie sofort 112 an oder gehen Sie in die nächste Notaufnahme. Unser diensthabender Zahnarzt wurde informiert; Praxis: {telefon}","ar":"قد تحتاج حالتك إلى رعاية عاجلة. يرجى الاتصال بالرقم 112 أو التوجه إلى أقرب قسم طوارئ فوراً. تم إبلاغ الطبيب المناوب؛ رقم العيادة: {telefon}","ru":"Ваше состояние может требовать срочной помощи. Пожалуйста, немедленно позвоните 112 или обратитесь в ближайшее отделение неотложной помощи. Дежурный врач уведомлен; телефон клиники: {telefon}","fr":"Cette situation peut nécessiter des soins urgents. Appelez immédiatement le 112 ou rendez-vous aux urgences les plus proches. Notre dentiste de garde a été prévenu : {telefon}","nl":"Dit kan spoedeisende zorg vereisen. Bel direct 112 of ga naar de dichtstbijzijnde spoedeisende hulp. Onze dienstdoende tandarts is gewaarschuwd: {telefon}","es":"Esta situación puede requerir atención urgente. Llame al 112 o acuda a urgencias de inmediato. Nuestro dentista de guardia ha sido avisado: {telefon}","it":"Questa situazione potrebbe richiedere cure urgenti. Chiami subito il 112 o si rechi al pronto soccorso più vicino. Il nostro dentista di turno è stato avvisato: {telefon}","fa":"وضعیت شما نیاز به مراقبت فوری و اورژانس دارد. لطفاً بدون معطلی با 112 تماس بگیرید یا به نزدیک‌ترین بخش اورژانس (emergency) مراجعه کنید. به دندانپزشک کشیک اطلاع داده شد؛ خط کلینیک: {telefon}","az":"Bildirdiyiniz vəziyyət təcili (acil / emergency) tibbi yardım tələb edə bilər. Lütfən dərhal 112 nömrəsinə zəng edin və ya ən yaxın təcili yardım şöbəsinə müraciət edin. Növbətçi həkimimiz məlumatlandırıldı; klinika xətti: {telefon}","uk":"Ваш стан може потребувати невідкладної допомоги. Будь ласка, негайно зателефонуйте 112 або зверніться до найближчого відділення екстреної допомоги. Чергового лікаря повідомлено: {telefon}","bg":"Състоянието ви може да изисква спешна помощ. Моля, незабавно се обадете на 112 или посетете най-близкото спешно отделение. Дежурният лекар е уведомен: {telefon}","ro":"Această situație poate necesita îngrijiri de urgență. Sunați imediat la 112 sau mergeți la cea mai apropiată unitate de primiri urgențe. Medicul de gardă a fost anunțat: {telefon}","el":"Η κατάστασή σας μπορεί να απαιτεί επείγουσα φροντίδα. Καλέστε αμέσως το 112 ή μεταβείτε στα επείγοντα. Ο εφημερεύων οδοντίατρος ενημερώθηκε: {telefon}","he":"מצב זה עלול לדרוש טיפול חירום מיידי. אנא חייגו 112 או פנו לחדר המיון הקרוב. רופא השיניים התורן עודכן; קו המרפאה: {telefon}"}},"templates":{"fiyat":{"tr":"Merhabalar, kliniğimize hoş geldiniz. Sağlığınız için en doğru tedavi planını ve net ücreti, uzman hekimimizin yapacağı muayene ve panoramik röntgen kontrolünüzden sonra size özel yazılı olarak paylaşıyoruz. Ön değerlendirme ve planlama için hangi gün ve saat aralığı size uyar?","en":"Hello and welcome to our clinic. To ensure the most accurate care, your personalized treatment plan and its exact cost are shared in writing by our specialist dentist after your clinical examination and X-ray review. Which day and time would suit you best for an initial consultation?","de":"Guten Tag und herzlich willkommen. Für eine präzise Planung erhalten Sie Ihren individuellen Behandlungs- und Kostenplan nach der Untersuchung und Röntgenkontrolle schriftlich von unserem Fachzahnarzt. Welcher Tag und welche Uhrzeit passen Ihnen für einen ersten Beratungstermin?","ar":"أهلاً ومرحباً بكم في عيادتنا. لضمان أدق رعاية طبية، يقوم طبيبنا المختص بمشاركة خطة العلاج وتكلفتها النهائية معكم كتابياً بعد الفحص السريري ومراجعة الأشعة. ما اليوم والوقت المناسبان لكم لموعد الاستشارة الأولى؟","ru":"Здравствуйте и добро пожаловать в нашу клинику! Точный план лечения и его стоимость наш врач-стоматолог составляет индивидуально в письменном виде после осмотра и рентген-диагностики. Какой день и время удобны вам для первичной консультации?","fr":"Bonjour et bienvenue dans notre clinique. Votre plan de traitement personnalisé ainsi que le devis détaillé vous sont remis par écrit par notre chirurgien-dentiste après l’examen clinique et radiographique. Quel jour et quelle heure vous conviendraient pour une première consultation ?","nl":"Hartelijk welkom bij onze kliniek. Voor een zorgvuldig advies ontvangt u uw persoonlijke behandelplan en de exacte kosten schriftelijk van onze tandarts na het onderzoek en de röntgencontrole. Welke dag en tijd passen u het beste voor een eerste consult?","es":"Hola y bienvenido a nuestra clínica. Para ofrecerle un diagnóstico preciso, nuestro odontólogo le entregará por escrito su plan de tratamiento personalizado y el presupuesto exacto tras la revisión y radiografía. ¿Qué día y hora le vienen bien para una primera consulta?","it":"Buongiorno e benvenuti nella nostra clinica. Per garantirle la massima precisione, il piano di trattamento personalizzato e il relativo preventivo vengono consegnati per iscritto dal nostro odontoiatra dopo la visita e il controllo radiografico. Quale giorno e orario preferisce per un primo consulto?","fa":"سلام و خوش آمدید به کلینیک ما. برای ارائه دقیق‌ترین طرح درمان، برنامه درمانی و هزینه نهایی پس از معاینه بالینی و بررسی رادیوگرافی توسط دندانپزشک متخصص به‌صورت مکتوب خدمتتان تقدیم می‌شود. چه روز و ساعتی برای وقت مشاوره اولیه برایتان مناسب است؟","az":"Salam, klinikamıza xoş gəlmisiniz. Sizin üçün ən dəqiq müalicə planı və ödəniş məbləği həkimimizin müayinəsi və rentgen dəyərləndirməsindən sonra yazılı şəkildə təqdim olunur. İlkin məsləhət görüşü üçün hansı gün və saat sizə uyğundur?","uk":"Добрий день і ласкаво просимо до нашої клініки! Індивідуальний план лікування та точну вартість наш лікар-стоматолог надає письмово після огляду та рентген-діагностики. Який день і час зручні для вас для первинної консультації?","bg":"Здравейте и добре дошли в нашата клиника. Индивидуалният план за лечение и точната цена се изготвят писмено от нашия лекар по дентална медицина след преглед и рентгенова диагностика. Кой ден и час са удобни за Вас за първична консултация?","ro":"Bună ziua și bun venit la clinica noastră. Planul de tratament personalizat și costul exact vă sunt oferite în scris de medicul nostru specialist după consultație și evaluarea radiografică. Ce zi și ce oră vă sunt convenabile pentru o primă programare?","el":"Καλημέρα σας και καλώς ήρθατε στην κλινική μας. Το εξατομικευμένο σχέδιο θεραπείας και το ακριβές κόστος παρέχονται γραπτώς από τον οδοντίατρό μας μετά την κλινική εξέταση και τον ακτινολογικό έλεγχο. Ποια ημέρα και ώρα σας εξυπηρετεί για το πρώτο ραντεβού;","he":"שלום וברוכים הבאים למרפאתנו. תוכנית הטיפול האישית והעלות המדויקת נמסרות בכתב על ידי רופא השיניים שלנו לאחר בדיקה קלינית וצילום. איזה יום ושעה מתאימים לכם לפגישת ייעוץ ראשונית?"},"randevu":{"tr":"Merhabalar, randevu talebinizi memnuniyetle aldık. Size en uygun gün ve saat aralığını (örneğin yarın öğleden sonra veya Salı 14:00 gibi) paylaşırsanız hasta koordinatörümüz hekim takvimini kontrol edip randevunuzu hemen teyit edecektir.","en":"Hello, we have gladly received your appointment request. Please share your preferred day and time window, and our patient coordinator will confirm your schedule promptly.","de":"Vielen Dank, wir haben Ihren Terminwunsch gerne aufgenommen. Bitte teilen Sie uns Ihren bevorzugten Tag und Ihre Wunschzeit mit; unser Team bestätigt Ihren Termin umgehend.","ar":"أهلاً بكم، لقد استلمنا طلب حجز موعدكم بكل سرور. يرجى مشاركة اليوم والوقت المفضلين لديكم ليقوم منسق المرضى بتأكيد موعدكم فوراً.","ru":"Здравствуйте! Мы с радостью приняли ваш запрос на запись. Пожалуйста, укажите удобный день и время, и наш координатор оперативно подтвердит ваш визит.","fr":"Votre demande de rendez-vous est bien reçue. Indiquez votre créneau préféré (ex. mardi après-midi) pour confirmation.","nl":"Wij hebben uw afspraakverzoek ontvangen. Laat ons weten welke dag en tijd uw voorkeur heeft.","es":"Hemos recibido su solicitud de cita. Indíquenos el día y la hora de su preferencia para confirmarle.","it":"Abbiamo ricevuto la sua richiesta di appuntamento. Ci indichi giorno e orario preferiti per la conferma.","fa":"درخواست نوبت شما ثبت شد. روز و ساعت پیشنهادی خود را بنویسید تا همکاران ما تایید کنند.","az":"Görüş sorğunuz qəbul edildi. Sizə uyğun gün və saatı yazın, komandamız təsdiqləsin.","uk":"Ваш запит на запис отримано. Напишіть зручний день та час, і ми підтвердимо візит.","bg":"Заявката ви за час е приета. Напишете удобен ден и час за потвърждение.","ro":"Am primit cererea de programare. Scrieți ziua și ora dorită, iar echipa va confirma.","el":"Λάβαμε το αίτημά σας για ραντεβού. Γράψτε μας την προτιμώμενη ημέρα και ώρα.","he":"בקשת התור התקבלה. כתבו לנו איזה יום ושעה מתאימים ונאשר מולכם."},"insan":{"tr":"Merhabalar, mesajınızı ve talebinizi kıdemli hasta danışmanımıza ve uzman hekim ekibimize hemen ilettik; çalışma saatlerimiz içinde size en kısa sürede özenle dönüş yapacağız.","en":"Hello, I have forwarded your inquiry directly to our senior patient coordinator and dental team; we will get back to you promptly during working hours.","de":"Wir haben Ihre Nachricht an unser Team weitergeleitet; Sie erhalten während der Öffnungszeiten eine Antwort.","ar":"تم تحويل رسالتكم إلى فريقنا وسيتواصلون معكم خلال ساعات العمل.","ru":"Мы передали ваше сообщение команде; с вами свяжутся в рабочие часы.","fr":"Votre message a été transmis à notre équipe qui vous répondra pendant les horaires d'ouverture.","nl":"Uw bericht is doorgestuurd naar ons team; wij nemen tijdens kantooruren contact op.","es":"Hemos enviado su mensaje a nuestro equipo; le responderán en horario laboral.","it":"Abbiamo inoltrato il messaggio al nostro team; le risponderemo in orario di apertura.","fa":"پیام شما به تیم کلینیک ارجاع شد؛ در ساعات کاری با شما تماس می‌گیریم.","az":"Mesajınız komandamıza ötürüldü; iş saatlarında sizinlə əlaqə saxlanılacaq.","uk":"Ми передали ваше повідомлення команді; з вами зв'яжуться в робочий час.","bg":"Предадохме съобщението ви на екипа; ще се свържем с вас в работно време.","ro":"Am transmis mesajul echipei noastre; veți fi contactat în timpul programului.","el":"Προωθήσαμε το μήνυμά σας στην ομάδα μας και θα επικοινωνήσουμε μαζί σας.","he":"העברנו את הודעתכם לצוות שלנו ונחזור אליכם בשעות הפעילות."},"sikayet":{"tr":"Merhabalar, yaşadığınız bu aksaklık nedeniyle kliniğimiz adına içtenlikle özür dileriz; memnuniyetiniz ve geri bildiriminiz bizim için çok kıymetli. Mesajınızı acil öncelikle doğrudan başhekimliğimize ilettim; kıdemli koordinatörümüz konuyu bizzat çözmek üzere sizinle en kısa sürede iletişime geçecektir.","en":"We sincerely apologize on behalf of our clinic for this inconvenience; your comfort and satisfaction mean everything to us. I have escalated your message directly to our Chief Dental Director, who will contact you personally right away.","de":"Das tut uns leid. Ihre Nachricht wurde direkt an unsere Praxisleitung weitergeleitet; wir melden uns zeitnah.","ar":"نأسف لما حدث. تم تحويل رسالتكم مباشرة إلى المدير الطبي وسيتم التواصل معكم قريباً.","ru":"Нам очень жаль. Ваше сообщение передано главному врачу, с вами свяжутся в ближайшее время.","fr":"Nous sommes désolés pour cette expérience. Votre message a été transmis directement au médecin-chef.","nl":"Het spijt ons dit te horen. Uw bericht is rechtstreeks doorgestuurd naar onze hoofdtandarts; wij nemen spoedig contact met u op.","es":"Lamentamos lo ocurrido. Su mensaje fue remitido directamente a la dirección médica.","it":"Ci scusiamo per l'accaduto. Il suo messaggio è stato inoltrato direttamente alla direzione sanitaria.","fa":"از بابت این موضوع متاسفیم. پیام شما مستقیماً به رئیس کلینیک ارجاع شد و در اسرع وقت با شما تماس گرفته خواهد شد.","az":"Yaşadığınız vəziyyətə görə üzr istəyirik. Mesajınız birbaşa baş həkimliyimizə ötürüldü; ən qısa zamanda sizinlə əlaqə saxlanılacaq.","uk":"Нам дуже шкода. Ваше повідомлення передано головному лікарю, з вами зв'яжуться найближчим часом.","bg":"Съжаляваме за случилото се. Съобщението ви е предадено директно на главния лекар.","ro":"Ne pare rău pentru această situație. Mesajul dvs. a fost transmis direct directorului medical.","el":"Λυπούμαστε για την εμπειρία σας. Το μήνυμά σας προωθήθηκε απευθείας στον επιστημονικό διευθυντή.","he":"אנו מצטערים לשמוע על כך. הודעתך הועברה ישירות למנהל הרפואי של המרפאה וניצור קשר בהקדם."},"gorsel":{"tr":"Merhabalar, panoramik röntgen veya diş fotoğrafınızı uzman hekimimizin ön değerlendirmesi için memnuniyetle inceleyebiliriz. Kişisel sağlık verilerinizin güvenliği gereği fotoğraf veya röntgen paylaşmadan önce sağlık verisi açık rıza formunu onaylamanız gerekir; onay bağlantısı ekibimiz tarafından hemen iletilecektir.","en":"We would be happy to have our specialist dentist review your dental X-ray or photo. To protect your medical privacy, please approve our brief health data consent form before sending images; our team is sending you the secure link right away.","de":"Bevor Sie Fotos oder Röntgenbilder senden, bestätigen Sie bitte die Einwilligung zur Verarbeitung von Gesundheitsdaten. Den Link sendet Ihnen unser Team.","ar":"قبل مشاركة الصور أو الأشعة يجب الموافقة على نموذج الموافقة على البيانات الصحية. سيرسل فريقنا رابط الموافقة.","ru":"Перед отправкой фото или снимков необходимо подтвердить согласие на обработку медицинских данных. Ссылку пришлёт наша команда.","fr":"Avant d'envoyer des photos ou radios, merci de valider le formulaire de consentement médical envoyé par notre équipe.","nl":"Voordat u foto's of röntgenfoto's deelt, dient u het toestemmingsformulier voor gezondheidsgegevens goed te keuren. Ons team stuurt u de link.","es":"Antes de enviar radiografías o fotos, es necesario aprobar el consentimiento de datos médicos que le enviará nuestro equipo.","it":"Prima di inviare foto o radiografie è necessario approvare il modulo di consenso sanitario inviato dal nostro team.","fa":"پیش از ارسال عکس یا رادیوگرافی، لازم است فرم رضایت‌نامه داده‌های سلامت را تایید کنید. لینک تایید توسط تیم ما ارسال می‌شود.","az":"Şəkil və ya rentgen göndərməzdən əvvəl sağlamlıq məlumatları üçün açıq razılıq formasını təsdiqləməlisiniz. Bağlantı komandamız tərəfindən göndəriləcək.","uk":"Перед надсиланням фото чи рентген-знімків необхідно підтвердити згоду на обробку медичних даних. Посилання надішле наша команда.","bg":"Преди да изпратите снимки или рентген, трябва да потвърдите формуляра за съгласие за здравни данни.","ro":"Înainte de a trimite fotografii sau radiografii, trebuie să aprobați formularul de consimțământ pentru date medicale.","el":"Πριν στείλετε φωτογραφίες ή ακτινογραφίες, απαιτείται έγκριση της φόρμας συγκατάθεσης ιατρικών δεδομένων.","he":"לפני שליחת תמונות או צילומי רנטגן יש לאשר את טופס ההסכמה לנתונים רפואיים שישלח הצוות שלנו."},"guvenli_yedek":{"tr":"Merhabalar, bu konuda sağlığınız açısından en doğru değerlendirmeyi uzman diş hekimimiz yapabilir. Mesajınızı doğrudan hekimimize ilettik; en kısa sürede size dönüş yapacağız.","en":"Hello, our specialist dentist is the best person to evaluate this safely for you. I have forwarded your message directly to our medical team and we will contact you shortly.","de":"Diese Frage beantwortet am besten unser Zahnarzt; wir haben Ihre Nachricht weitergeleitet.","ar":"طبيبنا هو الأنسب للإجابة على ذلك؛ تم تحويل رسالتكم إلى فريقنا.","ru":"На этот вопрос лучше ответит наш врач; мы передали ваше сообщение команде.","fr":"Notre dentiste répondra au mieux à cette question médicale ; votre message a été transmis.","nl":"Onze tandarts kan deze vraag het beste beantwoorden; wij hebben uw bericht doorgestuurd naar ons team.","es":"Nuestro dentista es la persona indicada para responderle; hemos remitido su consulta al equipo.","it":"Il nostro medico è la persona più indicata per rispondere; abbiamo inoltrato il messaggio al team.","fa":"پزشک ما بهترین پاسخ را در این مورد ارائه می‌دهد؛ پیام شما به تیم کلینیک ارجاع شد.","az":"Bu barədə ən dəqiq məlumatı həkimimiz verə bilər; mesajınızı komandamıza ötürdük.","uk":"На це запитання найкраще відповість наш лікар; ми передали ваше повідомлення команді.","bg":"Нашият лекар ще отговори най-точно на този въпрос; предадохме съобщението ви на екипа.","ro":"Medicul nostru vă poate oferi informația corectă; am transmis mesajul echipei noastre.","el":"Ο οδοντίατρός μας είναι ο πλέον αρμόδιος να απαντήσει· προωθήσαμε το μήνυμά σας στην ομάδα.","he":"רופא השיניים שלנו הוא הגורם המוסמך להשיב על כך; העברנו את הודעתך לצוות המרפאה."},"tibbi_soru":{"tr":"Merhabalar, öncelikle çok geçmiş olsun; ağrınızı ve hassasiyetinizi çok iyi anlıyoruz. Ancak sağlığınız ve güvenliğiniz için hekim muayenesi ve klinik değerlendirme olmadan buradan ilaç, antibiyotik veya doz kullanımı ya da mevcut ilacın kesilmesi doğru değildir. Durumunuzu acil öncelikle uzman diş hekimimize ve ekibimize ilettik; sizi en kısa sürede arayıp bilgilendireceğiz.","en":"Hello, I am very sorry to hear you are experiencing discomfort. For your safety, medication use, dosage advice, or stopping prescribed blood thinners is never recommended without a clinical examination by our dentist. We have prioritized and forwarded your message directly to our medical team.","de":"Guten Tag, wir wünschen Ihnen zunächst gute Besserung. Zu Ihrer Sicherheit empfehlen wir ohne ärztliche Untersuchung keine Medikamenteneinnahme, Dosisänderung oder das Absetzen von Blutverdünnern. Ihre Nachricht wurde vorrangig an unseren Zahnarzt weitergeleitet.","ar":"أهلاً بكم، نتمنى لكم السلامة والشفاء العاجل. حفاظاً على صحتكم، لا يُنصح بتناول أي دواء أو مضاد حيوي أو تعديل الجرعة دون فحص سريري من قبل الطبيب. تم تحويل رسالتكم بأولوية عاجلة إلى فريقنا الطبي.","ru":"Здравствуйте, искренне желаем вам скорейшего выздоровления. В целях вашей безопасности прием лекарств, антибиотиков или изменение дозировки без осмотра врача не рекомендуется. Ваше обращение приоритетно передано нашему врачу-стоматологу.","fr":"Bonjour, nous comprenons votre gêne et vous souhaitons un prompt rétablissement. Pour votre sécurité, aucune prise de médicament ou modification de posologie n’est recommandée sans examen clinique par notre dentiste. Votre message a été transmis en priorité à notre équipe médicale.","nl":"Hartelijk beterschap gewenst. Voor uw veiligheid wordt gebruik van medicatie of aanpassing van dosering zonder klinisch onderzoek door onze tandarts afgeraden. Uw bericht is met voorrang doorgestuurd naar ons medisch team.","es":"Hola, lamentamos mucho que tenga molestias. Por su seguridad, no se recomienda tomar medicamentos ni modificar dosis sin una valoración clínica de nuestro dentista. Hemos enviado su consulta con prioridad a nuestro equipo médico.","it":"Buongiorno, ci dispiace molto per il disagio che sta provando. Per la sua sicurezza, non è consigliato assumere farmaci o modificare il dosaggio senza una visita del nostro medico. Il suo messaggio è stato inoltrato con priorità al team clinico.","fa":"سلام، پیش از هر چیز برایتان آرزوی سلامتی داریم. برای حفظ ایمنی و سلامت شما، مصرف دارو، آنتی‌بیوتیک یا تغییر دوز بدون معاینه بالینی دندانپزشک توصیه نمی‌شود. پیام شما با اولویت فوری به تیم پزشکی ما ارجاع شد.","az":"Salam, keçmiş olsun, narahatlığınızı çox yaxşı anlayırıq. Sağlamlığınız üçün həkim müayinəsi olmadan dərman, antibiotik və ya doza istifadəsi tövsiyə edilmir. Müraciətiniz təcili olaraq həkim komandamıza yönləndirildi.","uk":"Добрий день, щиро бажаємо вам якнайшвидшого одужання. Заради вашої безпеки прийом ліків або зміна дозування без огляду лікаря не рекомендується. Ваше повідомлення пріоритетно передано нашому стоматологу.","bg":"Здравейте, желаем Ви бързо възстановяване. За Ваша безопасност приемът на лекарства или промяна на дозировката без клиничен преглед от зъболекар не се препоръчва. Съобщението Ви е предадено с приоритет на медицинския ни екип.","ro":"Bună ziua, vă dorim multă sănătate. Pentru siguranța dumneavoastră, administrarea medicamentelor sau modificarea dozelor fără un consult clinic la medicul stomatolog nu este recomandată. Mesajul a fost transmis cu prioritate echipei noastre medicale.","el":"Καλημέρα σας, ευχόμαστε περαστικά. Για την ασφάλειά σας, η λήψη φαρμάκων ή η αλλαγή δοσολογίας χ   function sGet(k, def) {

      return v === null ? def : v;

  window.__setViewMode = function(mode) {
    const vp = document.getElementById("dc-viewport");
    const mobStyle = document.getElementById("dc-style-mobile-override");
    const bDesk = document.getElementById("btn-mode-desktop");
    const bMob = document.getElementById("btn-mode-mobile");
    document.documentElement.setAttribute("data-view-mode", mode);
    if (mode === "mobile") {
      if (vp) vp.setAttribute("content", "width=device-width, initial-scale=1, user-scalable=yes");
      if (mobStyle) mobStyle.setAttribute("media", "all");
      document.body.style.zoom = "";
      if (bDesk) bDesk.classList.remove("active");
      if (bMob) bMob.classList.add("active");
    } else {
      if (vp) vp.setAttribute("content", "width=1360, user-scalable=yes");
      if (mobStyle) mobStyle.setAttribute("media", "not all");
      if (bDesk) bDesk.classList.add("active");
      if (bMob) bMob.classList.remove("active");
      applyDesktopFitIfNeeded();
    }
  };

  function applyDesktopFitIfNeeded() {
    document.body.style.zoom = "";
  }
  applyDesktopFitIfNeeded();

  window.__switchMasterTab = function(which) {
    const vLand = document.getElementById("dc-landing-view");
    const vPan = document.getElementById("dc-panel-view");
    const sLand = document.getElementById("dc-style-landing");
    const sPan = document.getElementById("dc-style-panel");
    const bPan = document.getElementById("btn-show-panel");
    const bLand = document.getElementById("btn-show-landing");
    const bLog = document.getElementById("btn-show-login");

    if (which === "landing") {
      vLand.classList.remove("dc-view-hidden");
      vPan.classList.add("dc-view-hidden");
      sLand.disabled = false;
      sPan.disabled = true;
      bLand.classList.add("active");
      bPan.classList.remove("active");
      bLog.classList.remove("active");
      window.scrollTo(0, 0);
    } else if (which === "login") {
      vLand.classList.add("dc-view-hidden");
      vPan.classList.remove("dc-view-hidden");
      sLand.disabled = true;
      sPan.disabled = false;
      bLog.classList.add("active");
      bPan.classList.remove("active");
      bLand.classList.remove("active");
      if (window.__DC_APP_CTRL) window.__DC_APP_CTRL.goLogin();
      window.scrollTo(0, 0);
    } else {
      vLand.classList.add("dc-view-hidden");
      vPan.classList.remove("dc-view-hidden");
      sLand.disabled = true;
      sPan.disabled = false;
      bPan.classList.add("active");
      bLand.classList.remove("active");
      bLog.classList.remove("active");
      if (window.__DC_APP_CTRL && !window.__DC_STATE.loggedInUser) {
        window.__DC_APP_CTRL.quickLogin("yonetici@dentacore.com", "DentaCore2026!");
      } else if (window.__DC_APP_CTRL) {
        window.__DC_APP_CTRL.boot();
      }
      window.scrollTo(0, 0);
    }
  };

    const lLink = e.target.closest("[data-switch-landing]");

  function normText(t) {
    return String(t || "")
      .replace(/ı/g, "i").replace(/İ/g, "i").replace(/ə/g, "e").replace(/Ə/g, "e")
      .normalize("NFKD").replace(/[\u0300-\u036f]/g, "")
      .toLowerCase().replace(/\s+/g, " ").trim();
  }
  function detectLang(text) {
    const raw = String(text || "").toLowerCase();
    if (/[\u0590-\u05FF]/.test(raw)) return "he";
    if (/[\u0600-\u06FF]/.test(raw)) {
      if (/[پچژگک]/.test(raw) || ["سلام", "نوبت", "قیمت", "دندان", "چند", "آدرس"].some(w => raw.includes(w))) return "fa";
      return "ar";
    }
    if (/[\u0370-\u03FF]/.test(raw)) return "el";
    if (/[\u0400-\u04FF]/.test(raw)) {
      if (/[іїєґ]/.test(raw) || ["добрий", "вітаю", "ціна", "скільки", "запис", "адреса"].some(w => raw.includes(w))) return "uk";
      if (["здравейте", "добър", "колко", "зъб", "работно време", "струва", "къде"].some(w => raw.includes(w))) return "bg";
      return "ru";
    }
    if (/[əƏ]/.test(raw)) return "az";
    if (/[ğşıİĞŞ]/.test(text || "")) return "tr";
    const n = normText(text);
    const words = new Set(n.match(/[a-z]+/g) || []);
    const lex = {
      de: ["ich","und","nicht","zahn","zahne","termin","bitte","hallo","wie","ist","sie","wir","mein","kosten","danke","guten","wo","adresse","ihre","zahnimplantat","kostet"],
      en: ["the","and","is","my","tooth","teeth","appointment","please","hello","hi","how","much","can","you","what","price","where","there","parking","swollen","cost","crowns","zirconia"],
      tr: ["merhaba","dis","disim","randevu","fiyat","ne","kadar","nerede","var","mi","mu","istiyorum","tesekkur","agri","slm","mrb","selam","kacta","acik","adresiniz","otopark","kanama"],
      fr: ["bonjour","salut","bonsoir","merci","prix","tarif","combien","adresse","horaires","rendez","vous","dent","dents","ou","etes"],
      nl: ["hallo","goedemorgen","afspraak","prijs","kosten","adres","waar","tandarts","openingstijden","bedankt"],
      es: ["hola","buenos","dias","gracias","precio","cuanto","cita","direccion","donde","horario","diente","dentista"],
      it: ["ciao","buongiorno","grazie","prezzo","quanto","appuntamento","indirizzo","dove","orari","dente","dentista"],
      az: ["salam","sabahiniz","xeyir","qiymet","unvan","hardasiniz","hekim","nece","gorus"],
      ro: ["buna","ziua","multumesc","pret","cat","costa","programare","adresa","unde","dinte","stomatolog"]
    };
    let best = "tr", bestScore = 0;
    for (const [lg, list] of Object.entries(lex)) {
      const sc = list.filter(w => words.has(w)).length;
      if (sc > bestScore) { bestScore = sc; best = lg; }
    }
    return best;
  }

  function simulateRoute(text, langIn, clinicObj) {
    const lang = (langIn && langIn.length >= 2) ? langIn : detectLang(text);
    const n = normText(text);
    const facts = {
      ...FAQ_DATA.facts,
      clinic: clinicObj ? clinicObj.name : "Özel DentaCore Merkez Polikliniği",
      adres: (clinicObj && clinicObj.address) ? clinicObj.address : FAQ_DATA.facts.adres,
      telefon: (clinicObj && clinicObj.phone) ? clinicObj.phone : FAQ_DATA.facts.telefon
    };
    const fmt = (str) => {
      let s = String(str || "");
      for (const [k, v] of Object.entries(facts)) s = s.replaceAll("{" + k + "}", String(v));
      return s;
    };
    const pick = (tbl) => fmt(tbl[lang] || tbl.en || tbl.tr);

    for (const [lg, patStr] of Object.entries(FAQ_DATA.emergency.patterns)) {
      try {
        if (new RegExp(normText(patStr)).test(n)) {
          return { answer: pick(FAQ_DATA.emergency.answers), layer: "L1-acil", intent: "acil", lang, tokens_in: 0, tokens_out: 0, alert: "acil", handoff: true };
        }
      } catch (e) {}
    }
    for (const [intentName, spec] of Object.entries(FAQ_DATA.intents)) {
      if (spec.only_short && n.split(" ").length > 4) continue;
      for (const [lg, patStr] of Object.entries(spec.patterns)) {

            return { answer: pick(spec.answers), layer: "L1-sss", intent: intentName, lang, tokens_in: 0, tokens_out: 0, alert: null, handoff: false };
          }
        } catch (e) {}
      }
    }
    for (const lbl of ["sikayet", "fiyat", "gorsel", "randevu"]) {
      const patStr = FAQ_DATA.classifier_keywords[lbl];

        try {

  function chart(series) {
    const W = 640, H = 175, pad = 22, n = series.length || 1;
    const max = Math.max(1, ...series.map((s) => Math.max(s.msgs, s.appts)));
    const svg = document.createElementNS(SVG, "svg");
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    svg.setAttribute("class", "chart");
    svg.setAttribute("preserveAspectRatio", "none");
    svg.setAttribute("aria-label", "Son 14 günlük mesaj ve randevu grafiği");
    const bw = (W - pad * 2) / n;
    const mk = (tagName, attrs) => {
      const e = document.createElementNS(SVG, tagName);
      for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
      svg.appendChild(e);
      return e;
    };
    for (let g = 0; g <= 4; g++) mk("line", { x1: pad, x2: W - pad, y1: pad + (H - pad * 2) * g / 4, y2: pad + (H - pad * 2) * g / 4, stroke: "#DCE4EE" });
    series.forEach((s, i) => {
      const x = pad + i * bw, hm = (H - pad * 2) * s.msgs / max, ha = (H - pad * 2) * s.appts / max;
      mk("rect", { x: x + bw * 0.14, y: H - pad - hm, width: bw * 0.34, height: Math.max(hm, 1), rx: 3, fill: "#0F766E" }).appendChild(titleNode(`${s.day}: ${s.msgs} mesaj`));
      mk("rect", { x: x + bw * 0.52, y: H - pad - ha, width: bw * 0.34, height: Math.max(ha, 1), rx: 3, fill: "#0A2540" }).appendChild(titleNode(`${s.day}: ${s.appts} randevu`));
      if (i % 2 === 0) {
        const t = mk("text", { x: x + bw / 2, y: H - 6, "text-anchor": "middle", "font-size": 10, fill: "#475569" });
        t.textContent = s.day;
      }
    });
    return svg;
  }
  function titleNode(t) { const e = document.createElementNS(SVG, "title"); e.textContent = t; return e; }
