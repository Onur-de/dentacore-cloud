<!doctype html>
<html lang="tr" data-view-mode="desktop">
<head>
<meta charset="utf-8">
<meta id="dc-viewport" name="viewport" content="width=1360, user-scalable=yes">
<title>DentaCore Yönetim Paneli</title>
<link rel="icon" href="data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2216%22%20fill%3D%22%230A2540%22/%3E%3Cpath%20d%3D%22M20%2018c-5%200-8%204-8%2010%200%209%204%2020%208%2020%203%200%203-8%206-12%201-1%202-2%206-2s5%201%206%202c3%204%203%2012%206%2012%204%200%208-11%208-20%200-6-3-10-8-10-4%200-7%202-12%202s-8-2-12-2z%22%20fill%3D%22%230D9488%22/%3E%3Ccircle%20cx%3D%2246%22%20cy%3D%2218%22%20r%3D%225%22%20fill%3D%22%23EA580C%22/%3E%3C/svg%3E" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>/* Hallmark · v2.0.0 · target: DentaCore admin panel (Operate) · surface: clinical precision */
/* Hallmark · pre-emit critique: P5 H5 E5 S5 R5 V5 · unified spacing scale, lifted tokens, non-sticky mobile bar */
/* Kendi sunucumuzdan sunulan medikal tipografi (dış CDN yok, CSP font-src 'self').
   Inter: ekran okunurluğu, açık harf boşlukları, Türkçe ş/ğ/ı/İ tam destek, tablo rakamları.
   Plus Jakarta Sans: sıcak ve güven veren başlık yüzü. */
:root {
  --navy: #0A2540;
  --navy-deep: #06182B;
  --navy-hover: #13385C;
  --teal: #0F766E;
  --teal-mid: #0D9488;
  --teal-bright: #5EEAD4;
  --teal-soft: #CCFBF1;
  --teal-mint: #F0FDF9;
  --teal-ink: #115E59;
  --amber: #C2410C;
  --amber-hover: #9A3412;
  --amber-soft: #FFF7ED;
  --amber-border: #FDBA74;
  --bg-canvas: #F8FAFC;
  --bg-surface: #FFFFFF;
  --bg-subtle: #F1F5F9;
  --ink: #0E1B2E;
  --ink-2: #2D3E52;
  --muted: #46576B;
  --on-dark: #F5F8FC;
  --on-dark-muted: #CBD5E1;
  --on-cta: #FFFFFF;
  --border: #E2E8F0;
  --border-field: #64748B;
  --red: #B91C1C;
  --red-soft: #FEE2E2;
  --red-border: #FCA5A5;
  --green: #15803D;
  --green-soft: #DCFCE7;
  --yellow-ink: #854D0E;
  --yellow-soft: #FEF3C7;
  --dark-badge-border: rgba(255, 255, 255, 0.22);
  --dark-badge-bg: rgba(255, 255, 255, 0.06);
  --dark-nav-hover: rgba(255, 255, 255, 0.08);
  --dark-nav-active: rgba(94, 234, 212, 0.16);
  --dark-line: rgba(255, 255, 255, 0.12);
  --dark-btn-border: rgba(255, 255, 255, 0.25);
  --scrim-modal: rgba(10, 37, 64, 0.48);
  --scrim-drawer: rgba(10, 37, 64, 0.28);
  --scrim-sheet: rgba(10, 37, 64, 0.5);
  --shadow-card: 0 1px 3px rgba(10, 37, 64, 0.05), 0 8px 20px rgba(10, 37, 64, 0.05);
  --shadow-btn: 0 1px 2px rgba(10, 37, 64, 0.08);
  --shadow-btn-cta: 0 4px 12px rgba(15, 118, 110, 0.2);
  --shadow-btn-primary: 0 4px 12px rgba(10, 37, 64, 0.18);
  --shadow-btn-teal: 0 4px 12px rgba(15, 118, 110, 0.2);
  --shadow-modal: 0 24px 64px rgba(10, 37, 64, 0.35);
  --shadow-drawer: -16px 0 48px rgba(10, 37, 64, 0.25);
  --shadow-fab: 0 12px 28px rgba(10, 37, 64, 0.25);
  --shadow-bottom-nav: 0 -4px 16px rgba(10, 37, 64, 0.08);
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --space-1: 8px;
  --space-2: 16px;
  --space-3: 24px;
  --space-4: 32px;
  --space-5: 48px;
  --font-sans: "Inter", "Segoe UI Variable Text", "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, "Noto Sans", "Noto Sans Arabic", "Noto Sans Hebrew", Tahoma, system-ui, sans-serif;
  --font-display: "Plus Jakarta Sans", "Inter", "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, "Noto Sans", Tahoma, system-ui, sans-serif;
  --cta: #0F766E;
  --cta-hover: #115E59;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  overflow-x: clip;
  background: var(--bg-canvas);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.65;
  text-rendering: optimizeLegibility;
  font-feature-settings: "cv02", "cv03", "cv04", "cv11";
  caret-color: var(--teal);
  scrollbar-color: var(--border-field) var(--bg-subtle);
  -webkit-font-smoothing: antialiased;
}

/* Başlıklar: güven veren, sakin başlık yüzü */
h1, h2, h3, .brand, .brand-name { font-family: var(--font-display); letter-spacing: -0.015em; }

::selection { background: var(--teal-soft); color: var(--navy); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--teal); }
.hidden { display: none !important; }

h1, h2, h3 {
  letter-spacing: -0.015em;
  text-wrap: balance;
  overflow-wrap: break-word;
  min-width: 0;
}

.skip-link {
  position: absolute;
  left: -9999px;
  top: var(--space-1);
  z-index: 120;
  background: var(--navy);
  color: var(--on-cta);
  padding: 12px var(--space-2);
  border-radius: var(--radius-sm);
  font-weight: 700;
  text-decoration: none;
}
.skip-link:focus { left: 12px; }

:focus-visible {
  outline: 3px solid var(--teal);
  outline-offset: 2px;
}
.side :focus-visible, .m-topbar :focus-visible {
  outline-color: var(--teal-bright);
}

/* Login */
.login {
  min-height: 100dvh;
  display: grid;
  grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr);
}
.login-art {
  background: linear-gradient(160deg, var(--navy), var(--navy-deep));
  color: var(--on-dark-muted);
  padding: var(--space-5);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: var(--space-3);
}
.login-art h1 {
  font-size: clamp(1.75rem, 2.8vw, 2.3rem);
  line-height: 1.18;
  margin: 0 0 12px;
  color: var(--on-dark);
  letter-spacing: -0.02em;
}
.login-art p { color: var(--on-dark-muted); max-width: 48ch; margin: 0; }
.badges { display: flex; flex-wrap: wrap; gap: var(--space-1); margin-top: var(--space-3); }
.badge {
  border: 1px solid var(--dark-badge-border);
  background: var(--dark-badge-bg);
  color: var(--on-dark);
  padding: var(--space-1) 12px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 600;
}
.login-form {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--space-3) 20px;
}
.card-login {
  width: 100%;
  max-width: 430px;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: var(--space-3);
  box-shadow: var(--shadow-card);
}
.card-login h2 { margin: 0 0 4px; font-size: 22px; color: var(--navy); }
.card-login .sub { color: var(--muted); margin: 0 0 var(--space-2); font-size: 14.5px; }

.demo-box {
  background: var(--bg-canvas);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 12px;
  margin-bottom: var(--space-2);
}
.demo-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--navy);
  margin-bottom: var(--space-1);
}
.demo-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: var(--space-1);
}
.demo-btn {
  width: 100%;
  min-height: 44px;
  padding: var(--space-1) 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-field);
  background: var(--bg-surface);
  color: var(--navy);
  text-align: left;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  transition: background-color 0.15s ease;
}
.demo-btn:hover { background: var(--teal-soft); }
.demo-btn:active { transform: translateY(1px); }
.demo-btn strong { font-size: 13.5px; display: block; }
.demo-btn span { font-size: 12.5px; color: var(--muted); font-family: var(--font-mono); }

.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
.field label { font-size: 13.5px; font-weight: 650; color: var(--navy); }
.input, select.input, textarea.input {
  min-height: 44px;
  border: 1px solid var(--border-field);
  background: var(--bg-surface);
  border-radius: var(--radius-sm);
  padding: var(--space-1) 12px;
  width: 100%;
  color: var(--ink);
}
textarea.input { min-height: 84px; }

.btn {
  min-height: 44px;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  padding: var(--space-1) var(--space-2);
  font-weight: 650;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: var(--space-1);
  justify-content: center;
  text-decoration: none;
  white-space: nowrap;
  transition: background-color 0.18s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.18s ease, border-color 0.18s ease, transform 0.12s ease;
}
.btn:active { transform: translateY(1px) scale(0.99); }
.btn:disabled { opacity: 0.58; cursor: not-allowed; box-shadow: none; transform: none; }
.btn-cta { background: var(--cta); color: var(--on-cta); box-shadow: var(--shadow-btn); }
.btn-cta:hover { background: var(--cta-hover); box-shadow: var(--shadow-btn-cta); }
.btn-primary { background: var(--navy); color: var(--on-cta); }
.btn-primary:hover { background: var(--navy-hover); box-shadow: var(--shadow-btn-primary); }
.btn-teal { background: var(--teal); color: var(--on-cta); }
.btn-teal:hover { background: var(--teal-ink); box-shadow: var(--shadow-btn-teal); }
.btn-ghost { background: var(--bg-surface); border-color: var(--border-field); color: var(--navy); }
.btn-ghost:hover { background: var(--teal-mint); border-color: var(--teal); color: var(--teal-ink); }
.btn-danger { background: var(--bg-surface); border-color: var(--red-border); color: var(--red); }
.btn-danger:hover { background: var(--red-soft); }
.btn-sm { min-height: 40px; padding: var(--space-1) 12px; font-size: 13px; border-radius: 8px; }
.btn-block { width: 100%; min-height: 44px; }

.err { color: var(--red); font-size: 13.5px; font-weight: 600; min-height: 20px; margin-bottom: var(--space-1); }
.lock-note { display: flex; gap: var(--space-1); align-items: center; color: var(--muted); font-size: 13px; margin-top: 12px; }

/* App Shell */
.shell {
  display: grid;
  grid-template-columns: 256px minmax(0, 1fr);
  min-height: 100dvh;
}
.side {
  background: var(--navy);
  color: var(--on-dark-muted);
  display: flex;
  flex-direction: column;
  padding: var(--space-2) 12px;
  position: sticky;
  top: 0;
  height: 100dvh;
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 4px 12px var(--space-2);
  color: var(--on-dark);
  font-weight: 750;
}
.brand img { width: 32px; height: 32px; flex: none; }
.brand small { display: block; color: var(--teal-bright); font-weight: 600; font-size: 12px; }
.nav { display: flex; flex-direction: column; gap: 4px; flex: 1; overflow-y: auto; }
.nav a {
  display: flex;
  align-items: center;
  gap: 12px;
  color: var(--on-dark-muted);
  text-decoration: none;
  padding: var(--space-1) 12px;
  min-height: 44px;
  border-radius: var(--radius-sm);
  font-weight: 550;
  font-size: 14.5px;
  transition: background-color 0.15s ease, color 0.15s ease;
}
.nav a:hover { background: var(--dark-nav-hover); color: var(--on-dark); }
.nav a.active {
  background: var(--dark-nav-active);
  color: var(--on-dark);
  box-shadow: inset 3px 0 0 var(--teal-bright);
}
.nav .count {
  margin-left: auto;
  background: var(--cta);
  color: var(--on-cta);
  border-radius: 999px;
  font-size: 12px;
  padding: 0 var(--space-1);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.nav .sep { height: 1px; background: var(--dark-line); margin: var(--space-1); }
.ico {
  width: 18px;
  height: 18px;
  flex: none;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.9;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.me {
  border-top: 1px solid var(--dark-line);
  padding: 12px var(--space-1) 0;
  display: flex;
  align-items: center;
  gap: 12px;
}
.avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--teal);
  color: var(--on-cta);
  display: grid;
  place-items: center;
  font-weight: 700;
  font-size: 13px;
  flex: none;
}
.me .who { flex: 1; min-width: 0; }
.me .who b { display: block; color: var(--on-dark); font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.me .who span { font-size: 12px; color: var(--on-dark-muted); }
.me button {
  min-width: 38px;
  min-height: 38px;
  background: transparent;
  border: 1px solid var(--dark-btn-border);
  color: var(--on-dark);
  border-radius: 8px;
  padding: var(--space-1);
  cursor: pointer;
}
.me button:active { transform: translateY(1px); }

.main {
  padding: var(--space-3) var(--space-4) 84px;
  min-width: 0;
}

.hq-banner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  background: var(--amber-soft);
  border: 1px solid var(--amber-border);
  color: var(--amber-hover);
  border-radius: var(--radius-md);
  padding: 12px var(--space-2);
  margin-bottom: var(--space-2);
  font-weight: 650;
}

.top {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.top h1 { margin: 0; font-size: clamp(1.35rem, 2.2vw, 1.65rem); letter-spacing: -0.015em; color: var(--navy); }
.top p { margin: 4px 0 0; color: var(--muted); max-width: 72ch; }
.actions { display: flex; gap: var(--space-1); flex-wrap: wrap; align-items: center; }

/* Cards & KPIs */
.grid { display: grid; gap: 12px; }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.span-2 { grid-column: span 2; }
.card {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-card);
  padding: 20px;
  min-width: 0;
}
.card-flush { padding: 0; }
.card h3 {
  margin: 0 0 12px;
  font-size: 16px;
  color: var(--navy);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-1);
  flex-wrap: wrap;
}
.kpi .label { color: var(--muted); font-size: 13.5px; font-weight: 650; }
.kpi .value {
  font-size: 28px;
  font-weight: 750;
  color: var(--navy);
  letter-spacing: -0.02em;
  margin-top: var(--space-1);
  font-variant-numeric: tabular-nums;
}
.kpi .hint { color: var(--muted); font-size: 13px; margin-top: 4px; }
.kpi.loss { background: var(--amber-soft); border-color: var(--amber-border); }
.kpi.loss .value { color: var(--amber-hover); }
.kpi.good .value { color: var(--teal); }
.bar { height: 8px; border-radius: 99px; background: var(--bg-subtle); overflow: hidden; margin-top: 12px; }
.bar i { display: block; height: 100%; background: var(--teal); border-radius: 99px; }
.chart { width: 100%; height: 175px; }
.legend { display: flex; gap: 12px; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: var(--space-1); vertical-align: -1px; }

/* Tables */
.table-wrap { overflow-x: auto; max-width: 100%; }
.table { width: 100%; border-collapse: separate; border-spacing: 0; min-width: 560px; }
.table th {
  text-align: left;
  font-size: 13px;
  color: var(--navy);
  font-weight: 700;
  padding: 12px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-canvas);
}
.table td { padding: 12px; border-bottom: 1px solid var(--bg-subtle); vertical-align: middle; }
.table tr.click { cursor: pointer; }
.table tr.click:hover td { background: var(--bg-canvas); }
.table .num { text-align: right; font-variant-numeric: tabular-nums; }
.empty { color: var(--muted); text-align: center; padding: var(--space-4) 12px; }
.error-card {
  background: var(--red-soft);
  border: 1px solid var(--red-border);
  color: var(--red);
  padding: var(--space-2);
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.skeleton {
  height: 120px;
  background: var(--bg-subtle);
  border-radius: var(--radius-md);
  border: 1px solid var(--border);
}

.tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px var(--space-1);
  border-radius: 999px;
  font-size: 12.5px;
  font-weight: 650;
  background: var(--bg-subtle);
  color: var(--ink-2);
  white-space: nowrap;
}
.tag.teal { background: var(--teal-soft); color: var(--teal-ink); }
.tag.red { background: var(--red-soft); color: var(--red); }
.tag.green { background: var(--green-soft); color: var(--green); }
.tag.amber { background: var(--amber-soft); color: var(--amber-hover); border: 1px solid var(--amber-border); }
.tag.yellow { background: var(--yellow-soft); color: var(--yellow-ink); }

/* Calendar: Week + Month */
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: var(--space-1); margin-bottom: var(--space-2); }
.day {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 12px;
  cursor: pointer;
  text-align: left;
  min-height: 62px;
}
.day:active { transform: translateY(1px); }
.day b { display: block; color: var(--navy); font-size: 15px; }
.day span { color: var(--muted); font-size: 12.5px; }
.day.sel { border-color: var(--teal); box-shadow: 0 0 0 2px var(--teal); }
.day .n { float: right; font-weight: 750; color: var(--teal); font-variant-numeric: tabular-nums; }

.month-wrap {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 12px;
  margin-bottom: var(--space-2);
}
.month-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}
.month-title h2 { margin: 0; font-size: 18px; color: var(--navy); }
.month-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: var(--space-1);
}
.month-dow {
  text-align: center;
  font-size: 12.5px;
  font-weight: 700;
  color: var(--muted);
  padding: 4px 0;
}
.mcell {
  min-height: 76px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: var(--space-1);
  background: var(--bg-canvas);
  text-align: left;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.mcell:active { transform: translateY(1px); }
.mcell.out { opacity: 0.52; }
.mcell.sel { border-color: var(--teal); background: var(--bg-surface); box-shadow: 0 0 0 2px var(--teal); }
.mcell-head { display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 700; color: var(--navy); }
.mcell-cnt { background: var(--teal-soft); color: var(--teal-ink); border-radius: 999px; padding: 0 var(--space-1); font-size: 11.5px; font-weight: 700; }
.mcell-item { font-size: 11.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.slot {
  display: grid;
  grid-template-columns: 82px minmax(0, 1fr) auto;
  gap: 12px;
  align-items: center;
  padding: 12px var(--space-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--bg-surface);
  margin-bottom: var(--space-1);
}
.slot.cancelled { opacity: 0.58; }
.slot .t { font-weight: 750; color: var(--navy); font-size: 16px; font-variant-numeric: tabular-nums; }
.slot .t small { display: block; color: var(--muted); font-weight: 550; font-size: 12px; }
.slot .p b { color: var(--ink); }
.slot .p div { color: var(--muted); font-size: 13.5px; }

/* AI Simulator & RTL */
.sim-card {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-card);
  padding: 20px;
  margin-bottom: var(--space-2);
}
.sim-presets { display: flex; flex-wrap: wrap; gap: var(--space-1); margin-bottom: 12px; }
.sim-form-row {
  display: grid;
  grid-template-columns: 220px minmax(0, 1fr) auto;
  gap: 12px;
  align-items: end;
}
.sim-reply {
  margin-top: 12px;
  border: 1px solid var(--border);
  background: var(--bg-canvas);
  border-radius: var(--radius-md);
  padding: 12px var(--space-2);
}
.sim-reply-head {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-1);
  margin-bottom: 12px;
  direction: ltr;
}
.sim-reply-text {
  font-size: 15.5px;
  color: var(--navy);
  font-weight: 550;
  line-height: 1.55;
  margin: 0;
  unicode-bidi: plaintext;
}
.sim-reply-text[dir="rtl"] {
  text-align: right;
  font-size: 16.5px;
  unicode-bidi: isolate;
}

/* Handoff & Ecosystem Cards */
.handoff-box {
  background: var(--bg-canvas);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 12px;
  margin-bottom: 12px;
}
.handoff-box pre {
  margin: 0;
  white-space: pre-wrap;
  word-break: break-word;
  font-family: var(--font-mono);
  font-size: 12.5px;
  color: var(--ink);
  line-height: 1.55;
}
.eco-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
  margin-bottom: 12px;
}
.eco-item {
  border: 1px solid var(--border);
  background: var(--bg-canvas);
  border-radius: var(--radius-sm);
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.eco-item strong { color: var(--navy); font-size: 14px; }
.eco-item small { color: var(--muted); font-size: 12.5px; word-break: break-all; }

/* Modals, Drawers, Toasts */
.overlay {
  position: fixed;
  inset: 0;
  background: var(--scrim-modal);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 60;
  padding: var(--space-2);
}
.modal {
  background: var(--bg-surface);
  border-radius: var(--radius-lg);
  width: 100%;
  max-width: 560px;
  box-shadow: var(--shadow-modal);
  padding: var(--space-3);
  max-height: 92dvh;
  overflow-y: auto;
}
.modal h2 { margin: 0 0 12px; color: var(--navy); font-size: 19px; }
.modal .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.modal .foot { display: flex; justify-content: flex-end; gap: var(--space-1); margin-top: 12px; }

.drawer-wrap > .overlay {
  z-index: 54;
  background: var(--scrim-drawer);
}
.drawer {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  width: min(560px, 100%);
  background: var(--bg-surface);
  box-shadow: var(--shadow-drawer);
  z-index: 55;
  overflow-y: auto;
  padding: var(--space-3);
}
.drawer h2 { margin: 0; color: var(--navy); }
.drawer .table { min-width: 0; }
.kv { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: var(--space-1) 12px; margin: 12px 0; }
.kv span { color: var(--muted); }
.section-t { margin: 20px 0 var(--space-1); font-size: 13.5px; color: var(--navy); font-weight: 700; }

.toast {
  position: fixed;
  bottom: var(--space-3);
  left: 50%;
  transform: translateX(-50%);
  background: var(--navy);
  color: var(--on-cta);
  padding: 12px 20px;
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-card);
  z-index: 90;
  font-weight: 650;
  max-width: calc(100% - var(--space-4));
}
.toast.bad { background: var(--red); }

.search { max-width: 300px; }
.alert-item { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid var(--bg-subtle); flex-wrap: wrap; }
.alert-item:last-child { border-bottom: 0; }
.alert-item .k { flex: none; }
.alert-item .d { flex: 1; min-width: 180px; }
.alert-item .d small { display: block; color: var(--muted); }
.mono { font-family: var(--font-mono); font-size: 12.5px; }
.secret {

  border: 1px dashed var(--border-field);
  border-radius: var(--radius-sm);

  color: var(--navy);

.idle {

  top: 12px;
  right: 12px;
  background: var(--amber-soft);
  border: 1px solid var(--amber-border);
  color: var(--amber-hover);
  border-radius: var(--radius-md);
  padding: 12px var(--space-2);
  z-index: 80;
  box-shadow: var(--shadow-card);
  font-weight: 650;
}
.cal-box {
  background: var(--bg-canvas);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 12px;
  margin-bottom: 12px;
}
.cal-box code {
  display: block;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  padding: var(--space-1) 12px;
  border-radius: var(--radius-sm);
  word-break: break-all;
  margin: var(--space-1) 0;

.side-asst {

}

  white-space: pre-wrap;
  margin-top: 12px;
  font-size: 14px;
  min-height: 72px;
}

.m-topbar { display: none; }
.m-bottom-nav { display: none; }
.m-more-sheet {
  position: fixed;
  inset: 0;
  z-index: 70;
  background: var(--scrim-sheet);
  display: flex;
  align-items: flex-end;
}
.m-more-panel {

  margin-top: 12px;
}

  align-items: center;
  gap: var(--space-1);
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--navy);
  font-weight: 650;
  font-size: 14px;
  text-decoration: none;
  min-height: 44px;
}
.m-more-grid a.active { background: var(--teal-soft); border-color: var(--teal); color: var(--teal-ink); }

@media (max-width: 1px) {
  .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g3, .eco-grid { grid-template-columns: 1fr; }

}

@media (max-width: 1px) {

  .m-topbar-brand img { width: 28px; height: 28px; flex: none; }
  .m-topbar-brand div { min-width: 0; }
  .m-topbar-brand strong { display: block; font-size: 15px; color: var(--on-dark); }
  .m-topbar-brand small { display: block; font-size: 12px; color: var(--teal-bright); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
  .main { padding: var(--space-2) var(--space-2) 96px; }
  .g2, .modal .row, .sim-form-row { grid-template-columns: 1fr; }

  .mcell { min-height: 52px; padding: 4px; }
  .mcell-item { display: none; }
  .m-bottom-nav {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 45;
    background: var(--bg-surface);
    border-top: 1px solid var(--border);
    padding: 4px 4px calc(4px + env(safe-area-inset-bottom, 0px));

  }
  .m-bottom-nav a, .m-bottom-nav button {

    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;

    background: transparent;
    color: var(--muted);
    text-decoration: none;
    font-size: 11.5px;
    font-weight: 650;

  .toast { bottom: 76px; }
}

@media (max-width: 1px) {

  .btn { white-space: normal; text-align: center; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition-duration: 0.01ms !important;
    animation-duration: 0.01ms !important;
  }
}

"},"guvenli_yedek":{"tr":"Bu konuda doğru bilgiyi hekimimiz verebilir; mesajınızı ekibimize ilettik.","en":"Our dentist is the right person to answer this; we have forwarded your message to our team.","de":"Diese Frage beantwortet am besten unser Zahnarzt; wir haben Ihre Nachricht weitergeleitet.","ar":"طبيبنا هو الأنسب للإجابة على ذلك؛ تم تحويل رسالتكم إلى فريقنا.","ru":"На этот вопрос лучше ответит наш врач; мы передали ваше сообщение команде.","fr":"Notre dentiste répondra au mieux à cette question médicale ; votre message a été transmis.","es":"Nuestro dentista es la persona indicada para responderle; hemos remitido su consulta al equipo."}},"classifier_keywords":{"fiyat":"(fiyat|ucret|ne kadar|kac (tl|para|lira)|price|cost|how much|preis|kosten|wie viel|tarif|combien|cout|prijs|kosten|precio|cuanto|costo|prezzo|quanto|qiymet|neceye|ціна|скільки|цена|колко|pret|cat costa|τιμή|πόσο|מחיר|כמה|سعر|تكلفة|كم|قیمت|چند)","randevu":"(randevu|muayene olmak|gelmek istiyorum|appointment|book|termin|rendez-vous|afspraak|cita|appuntamento|gorus|nə vaxt|запис|час|programare|ραντεβού|תור|موعد|نوبت)","sikayet":"(sikayet|memnun degil|rezalet|magdur|complain|disappointed|beschwerde|reclamation|queja|klacht|reclamo|şikayət|скарга|оплакване|plangere|παράπονο|תלונה|شكوى|жалоб|شکایت)","gorsel":"(rontgen|fotograf|resim gonder|x-?ray|photo|panoramik|röntgen|radio|radiographie|radiografia|foto|şəkil|знімок|снимок|рентген|ауто|ακτινογραφία|צילום|רנטגן|صورة|أشعة|عکس|رادیوگرافی)","yuksek_deger":"(implant|all.?on.?4|all.?on.?6|zirkonyum|zirconia|zirkon|gulus tasarimi|smile design|veneer|lamina|seffaf plak|invisalign|clear aligner|hollywood smile|couronne|facette|corona|implan)"}};

  function sGet(k, def) {
    try {
      const v = window.localStorage.getItem(k);
      return v === null ? def : v;
    } catch (e) { return def; }
  }
  function sSet(k, v) {
    try { window.localStorage.setItem(k, String(v)); } catch (e) {}
  }

  window.__setViewMode = function(mode) {
    const vp = document.getElementById("dc-viewport");
    const mobStyle = document.getElementById("dc-style-mobile-override");
    const bDesk = document.getElementById("btn-mode-desktop");
    const bMob = document.getElementById("btn-mode-mobile");
    document.documentElement.setAttribute("data-view-mode", mode);
    if (mode === "mobile") {
      if (vp) vp.setAttribute("content", "width=device-width, initial-scale=1, user-scalable=yes");
      if (mobStyle) mobStyle.setAttribute("media", "all");
      document.body.style.zoom = "";
      if (bDesk) bDesk.classList.remove("active");
      if (bMob) bMob.classList.add("active");
    } else {
      if (vp) vp.setAttribute("content", "width=1360, user-scalable=yes");
      if (mobStyle) mobStyle.setAttribute("media", "not all");
      if (bDesk) bDesk.classList.add("active");
      if (bMob) bMob.classList.remove("active");
      applyDesktopFitIfNeeded();
    }
  };

  function applyDesktopFitIfNeeded() {
    if (document.documentElement.getAttribute("data-view-mode") !== "desktop") {
      document.body.style.zoom = "";
      return;
    }
    const w = window.innerWidth || document.documentElement.clientWidth || 1360;
    if (w > 0 && w < 1024) {
      document.body.style.zoom = String(Math.max(0.26, Math.min(1, w / 1360)));
    } else {
      document.body.style.zoom = "";
    }
  }
  window.addEventListener("resize", applyDesktopFitIfNeeded);
  applyDesktopFitIfNeeded();

  window.__switchMasterTab = function(which) {
    const vLand = document.getElementById("dc-landing-view");
    const vPan = document.getElementById("dc-panel-view");
    const sLand = document.getElementById("dc-style-landing");
    const sPan = document.getElementById("dc-style-panel");
    const bPan = document.getElementById("btn-show-panel");
    const bLand = document.getElementById("btn-show-landing");
    const bLog = document.getElementById("btn-show-login");

    if (which === "landing") {
      vLand.classList.remove("dc-view-hidden");
      vPan.classList.add("dc-view-hidden");
      sLand.disabled = false;
      sPan.disabled = true;
      bLand.classList.add("active");
      bPan.classList.remove("active");
      bLog.classList.remove("active");
      window.scrollTo(0, 0);
    } else if (which === "login") {
      vLand.classList.add("dc-view-hidden");
      vPan.classList.remove("dc-view-hidden");
      sLand.disabled = true;
      sPan.disabled = false;
      bLog.classList.add("active");
      bPan.classList.remove("active");
      bLand.classList.remove("active");
      if (window.__DC_APP_CTRL) window.__DC_APP_CTRL.goLogin();
      window.scrollTo(0, 0);
    } else {
      vLand.classList.add("dc-view-hidden");
      vPan.classList.remove("dc-view-hidden");
      sLand.disabled = true;
      sPan.disabled = false;
      bPan.classList.add("active");
      bLand.classList.remove("active");
      bLog.classList.remove("active");
      if (window.__DC_APP_CTRL && !window.__DC_STATE.loggedInUser) {
        window.__DC_APP_CTRL.quickLogin("yonetici@dentacore.com", "DentaCore2026!");
      } else if (window.__DC_APP_CTRL) {
        window.__DC_APP_CTRL.boot();
      }
      window.scrollTo(0, 0);

  function normText(t) {
    return String(t || "")
      .replace(/ı/g, "i").replace(/İ/g, "i").replace(/ə/g, "e").replace(/Ə/g, "e")
      .normalize("NFKD").replace(/[\u0300-\u036f]/g, "")
      .toLowerCase().replace(/\s+/g, " ").trim();
  }
  function detectLang(text) {
    const raw = String(text || "").toLowerCase();
    if (/[\u0590-\u05FF]/.test(raw)) return "he";
    if (/[\u0600-\u06FF]/.test(raw)) {
      if (/[پچژگک]/.test(raw) || ["سلام", "نوبت", "قیمت", "دندان", "چند", "آدرس"].some(w => raw.includes(w))) return "fa";
      return "ar";
    }
    if (/[\u0370-\u03FF]/.test(raw)) return "el";
    if (/[\u0400-\u04FF]/.test(raw)) {
      if (/[іїєґ]/.test(raw) || ["добрий", "вітаю", "ціна", "скільки", "запис", "адреса"].some(w => raw.includes(w))) return "uk";
      if (["здравейте", "добър", "колко", "зъб", "работно време", "струва", "къде"].some(w => raw.includes(w))) return "bg";
      return "ru";
    }
    if (/[əƏ]/.test(raw)) return "az";
    if (/[ğşıİĞŞ]/.test(text || "")) return "tr";
    const n = normText(text);
    const words = new Set(n.match(/[a-z]+/g) || []);
    const lex = {
      de: ["ich","und","nicht","zahn","zahne","termin","bitte","hallo","wie","ist","sie","wir","mein","kosten","danke","guten","wo","adresse","ihre","zahnimplantat","kostet"],
      en: ["the","and","is","my","tooth","teeth","appointment","please","hello","hi","how","much","can","you","what","price","where","there","parking","swollen","cost","crowns","zirconia"],
      tr: ["merhaba","dis","disim","randevu","fiyat","ne","kadar","nerede","var","mi","mu","istiyorum","tesekkur","agri","slm","mrb","selam","kacta","acik","adresiniz","otopark","kanama"],
      fr: ["bonjour","salut","bonsoir","merci","prix","tarif","combien","adresse","horaires","rendez","vous","dent","dents","ou","etes"],
      nl: ["hallo","goedemorgen","afspraak","prijs","kosten","adres","waar","tandarts","openingstijden","bedankt"],
      es: ["hola","buenos","dias","gracias","precio","cuanto","cita","direccion","donde","horario","diente","dentista"],
      it: ["ciao","buongiorno","grazie","prezzo","quanto","appuntamento","indirizzo","dove","orari","dente","dentista"],
      az: ["salam","sabahiniz","xeyir","qiymet","unvan","hardasiniz","hekim","nece","gorus"],
      ro: ["buna","ziua","multumesc","pret","cat","costa","programare","adresa","unde","dinte","stomatolog"]
    };
    let best = "tr", bestScore = 0;
    for (const [lg, list] of Object.entries(lex)) {
      const sc = list.filter(w => words.has(w)).length;
      if (sc > bestScore) { bestScore = sc; best = lg; }
    }
    return best;
  }

  function simulateRoute(text, langIn, clinicObj) {
    const lang = (langIn && langIn.length >= 2) ? langIn : detectLang(text);
    const n = normText(text);
    const facts = {
      ...FAQ_DATA.facts,
      clinic: clinicObj ? clinicObj.name : "Özel DentaCore Merkez Polikliniği",
      adres: (clinicObj && clinicObj.address) ? clinicObj.address : FAQ_DATA.facts.adres,
      telefon: (clinicObj && clinicObj.phone) ? clinicObj.phone : FAQ_DATA.facts.telefon
    };
    const fmt = (str) => {
      let s = String(str || "");
      for (const [k, v] of Object.entries(facts)) s = s.replaceAll("{" + k + "}", String(v));
      return s;
    };
    const pick = (tbl) => fmt(tbl[lang] || tbl.en || tbl.tr);

    for (const [lg, patStr] of Object.entries(FAQ_DATA.emergency.patterns)) {
      try {
        if (new RegExp(normText(patStr)).test(n)) {
          return { answer: pick(FAQ_DATA.emergency.answers), layer: "L1-acil", intent: "acil", lang, tokens_in: 0, tokens_out: 0, alert: "acil", handoff: true };
        }
      } catch (e) {}
    }
    for (const [intentName, spec] of Object.entries(FAQ_DATA.intents)) {
      if (spec.only_short && n.split(" ").length > 4) continue;
      for (const [lg, patStr] of Object.entries(spec.patterns)) {

          if (new RegExp(normText(patStr)).test(n)) {
            return { answer: pick(spec.answers), layer: "L1-sss", intent: intentName, lang, tokens_in: 0, tokens_out: 0, alert: null, handoff: false };
          }
        } catch (e) {}
      }
    }
    for (const lbl of ["sikayet", "fiyat", "gorsel", "randevu"]) {
      const patStr = FAQ_DATA.classifier_keywords[lbl];
      if (patStr) {
        try {
          if (new RegExp(normText(patStr)).test(n)) {

              handoff: ["randevu", "sikayet"].includes(lbl)

        } catch (e) {}
      }
    }
    return {
      answer: pick(FAQ_DATA.templates.insan),

      intent: "genel",
      lang,
      tokens_in: 0,
      tokens_out: 0,
      alert: null,

  function modal(title, fields, onSubmit, submitText) {
    const prevFocus = document.activeElement;
    const err = h("div", { class: "err", role: "alert" });
    const btn = h("button", { class: "btn btn-cta", type: "submit" }, submitText || "Kaydet");
    const closeOv = () => {
      document.removeEventListener("keydown", onEsc);
      ov.remove();
      if (prevFocus && typeof prevFocus.focus === "function") prevFocus.focus();
    };
    const onEsc = (ev) => {
      if (ev.key !== "Escape") return;
      const modals = document.querySelectorAll(".modal");
      if (modals.length && modals[modals.length - 1] !== form) return;
      ev.stopImmediatePropagation();
      closeOv();
    };
    const titleId = "m-title-" + Math.random().toString(36).slice(2, 7);
    const form = h("form", {
      class: "modal",
      on: {
        submit: async (e) => {
          e.preventDefault();
          err.textContent = "";
          btn.disabled = true;
          try {
            const ok = await onSubmit(new FormData(form));
            if (ok !== false) closeOv();
          } catch (x) {
            if (x.message !== "oturum") err.textContent = x.message;
          } finally {
            btn.disabled = false;
          }
        },
      },
    },
      h("h2", { id: titleId, text: title }),
      fields,
      err,
      h("div", { class: "foot" },
        h("button", { class: "btn btn-ghost", type: "button", on: { click: closeOv } }, "Vazgeç"),
        btn
      )
    );
    const ov = h("div", {
      class: "overlay",
      role: "dialog",
      "aria-modal": "true",
      "aria-labelledby": titleId,
      on: { mousedown: (e) => { if (e.target === ov) closeOv(); } },
    }, form);
    document.addEventListener("keydown", onEsc);
    document.body.appendChild(ov);
    const first = form.querySelector("input,select,textarea,button");
    if (first) first.focus();
    return ov;
  }

    const W = 640, H = 175, pad = 22, n = series.length || 1;
    const max = Math.max(1, ...series.map((s) => Math.max(s.msgs, s.appts)));
    const svg = document.createElementNS(SVG, "svg");
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    svg.setAttribute("class", "chart");
    svg.setAttribute("preserveAspectRatio", "none");
    svg.setAttribute("aria-label", "Son 14 günlük mesaj ve randevu grafiği");
    const bw = (W - pad * 2) / n;
    const mk = (tagName, attrs) => {
      const e = document.createElementNS(SVG, tagName);
      for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
      svg.appendChild(e);
      return e;
    };
    for (let g = 0; g <= 4; g++) mk("line", { x1: pad, x2: W - pad, y1: pad + (H - pad * 2) * g / 4, y2: pad + (H - pad * 2) * g / 4, stroke: "#DCE4EE" });
    series.forEach((s, i) => {
      const x = pad + i * bw, hm = (H - pad * 2) * s.msgs / max, ha = (H - pad * 2) * s.appts / max;
      mk("rect", { x: x + bw * 0.14, y: H - pad - hm, width: bw * 0.34, height: Math.max(hm, 1), rx: 3, fill: "#0F766E" }).appendChild(titleNode(`${s.day}: ${s.msgs} mesaj`));
      mk("rect", { x: x + bw * 0.52, y: H - pad - ha, width: bw * 0.34, height: Math.max(ha, 1), rx: 3, fill: "#0A2540" }).appendChild(titleNode(`${s.day}: ${s.appts} randevu`));
      if (i % 2 === 0) {
        const t = mk("text", { x: x + bw / 2, y: H - 6, "text-anchor": "middle", "font-size": 10, fill: "#475569" });
        t.textContent = s.day;
      }
    });
    return svg;
  }
  function titleNode(t) { const e = document.createElementNS(SVG, "title"); e.textContent = t; return e; }

  VIEWS.calendar = async () => {
    const mode = S.calMode === "month" ? "month" : "week";
    let fetchStart, fetchEnd;
    if (mode === "month") {
      const mFirst = new Date(S.day.getFullYear(), S.day.getMonth(), 1);
      fetchStart = monday(mFirst);
      fetchEnd = addDays(fetchStart, 42);
    } else {
      fetchStart = monday(S.day);
      fetchEnd = addDays(fetchStart, 7);
    }
    const list = await api(`/app/api/appointments?start=${encodeURIComponent(fetchStart.toISOString())}&end=${encodeURIComponent(fetchEnd.toISOString())}`);
    const byDay = {};
    list.forEach((a) => {
      const k = ymd(new Date(a.starts_at));
      (byDay[k] = byDay[k] || []).push(a);
    });

    const setMode = (m) => {
      S.calMode = m;
      lsSet("dc_cal_mode", m);
      route();
    };

    let calGridView;
    if (mode === "month") {
      const monthLabel = S.day.toLocaleDateString("tr-TR", { month: "long", year: "numeric" });

      const cells = [...Array(42)].map((_, idx) => {

        const k = ymd(d);
        const dayAppts = (byDay[k] || []).filter((a) => a.status !== "cancelled");
        return h("button", {
          type: "button",
          class: "mcell" + (d.getMonth() !== curMonth ? " out" : "") + (k === ymd(S.day) ? " sel" : ""),
          on: { click: () => { S.day = d; route(); } },
        },
          h("div", { class: "mcell-head" },

          ),
          dayAppts.slice(0, 2).map((a) => h("div", { class: "mcell-item", text: `${fmtT(a.starts_at)} ${a.patient || ""}` }))
        );
      });
      calGridView = h("div", { class: "month-wrap" },

          ),

            live ? act(a, "cancelled", "İptal", "btn-danger") : null,

    if (k === "bugun") return [t, addDays(t, 1)];
    if (k === "hafta") return [monday(t), addDays(monday(t), 7)];
    const m0 = new Date(t.getFullYear(), t.getMonth(), 1);
    if (k === "ay") return [m0, new Date(t.getFullYear(), t.getMonth() + 1, 1)];
    return [new Date(t.getFullYear(), t.getMonth() - 1, 1), m0];

    const rows = await api("/app/api/conversations");

    const simLang = sel("lang", [["", "Otomatik algıla (16 dil)"], ...LANG_OPTIONS], S.simLang || "");
    const simInput = inp("text", { required: true, placeholder: "Hastanın mesajını yazın (ör. Arapça, İngilizce, Türkçe)...", value: S.simText || "" });
    const simBtn = h("button", { class: "btn btn-cta", type: "submit" }, "Simüle Et");
    const simOut = h("div", { class: "sim-reply" + (S.simResult ? "" : " hidden"), role: "region", "aria-live": "polite" });

    function renderSimResult(r) {
      if (!r) return;
      const isRtl = RTL_LANGS.has(r.lang);
      simOut.classList.remove("hidden");
      simOut.replaceChildren(
        h("div", { class: "sim-reply-head" },
          tag(`Katman: ${r.layer}`, (r.layer || "").startsWith("L1") ? "green" : "teal"),
          tag(`Niyet: ${r.intent}`, ""),
          tag(`Dil: ${(r.lang || "tr").toUpperCase()}${isRtl ? " (RTL)" : ""}`, "teal"),
          tag(`Token: ${r.tokens_in} girdi / ${r.tokens_out} çıktı`, (r.tokens_in + r.tokens_out) === 0 ? "green" : "amber"),
          r.alert ? tag(`Uyarı: ${r.alert}`, "red") : null,
          r.handoff ? tag("Ekibe aktarım", "yellow") : null
        ),
        h("p", {
          class: "sim-reply-text",
          dir: isRtl ? "rtl" : "ltr",
          lang: r.lang || "tr",
          text: r.answer,
        })
      );
    }
    if (S.simResult) renderSimResult(S.simResult);

    let simReqId = 0;
    async function runSim(text, lang) {
      const myReq = ++simReqId;
      S.simText = text;
      S.simLang = lang || "";
      simBtn.disabled = true;
      simBtn.textContent = "Yanıtlanıyor...";
      simForm.querySelectorAll(".sim-presets button").forEach((b) => { b.disabled = true; });
      try {
        const body = lang ? { text, lang } : { text };
        const res = await api("/app/api/conversations/simulate", { method: "POST", body });
        if (myReq !== simReqId) return;
        S.simResult = res;
        renderSimResult(res);
        const freshRows = await api("/app/api/conversations");
        if (myReq === simReqId) tbody.replaceChildren(...buildConvRows(freshRows));
      } catch (e) {
        if (myReq === simReqId && e.message !== "oturum") toast(e.message, true);
      } finally {
        if (myReq === simReqId) {
          simBtn.disabled = false;
          simBtn.textContent = "Simüle Et";
          simForm.querySelectorAll(".sim-presets button").forEach((b) => { b.disabled = false; });
        }
      }
    }

    const simForm = h("form", {
      class: "sim-card",
      on: {
        submit: (e) => {
          e.preventDefault();
          const t = simInput.value.trim();
          if (!t) return;
          runSim(t, simLang.value);
        },
      },
    },
      h("h3", { text: "Canlı AI Mesaj Simülatörü (16 Dil + 3 Katmanlı Yönlendirici)" }),
      h("p", { style: "color:var(--muted);margin:0 0 12px;font-size:14px", text: "Seçili kliniğin bilgileriyle hastaya verilecek yanıtı, token katmanını ve RTL yönünü gerçek zamanlı test edin." }),
      h("div", { class: "sim-presets" }, SIM_PRESETS.map((p) =>
        h("button", {
          class: "btn btn-sm btn-ghost",
          type: "button",
          on: {
            click: () => {
              simInput.value = p.text;
              simLang.value = p.lang;
              runSim(p.text, p.lang);
            },
          },
        }, p.label)
      )),
      h("div", { class: "sim-form-row" },
        fld("Dil", simLang),
        fld("Hasta mesajı", simInput),
        simBtn
      ),
      simOut
    );

    const buildConvRows = (list) => list.length ? list.map((r) => h("tr", null,
      h("td", null, h("b", { text: r.display_name || `Hasta #${r.id}` })),
      h("td", null, tag(r.channel === "ig" ? "Instagram" : r.channel === "simulator" ? "Simülatör" : "WhatsApp", r.channel === "ig" ? "amber" : "teal")),
      h("td", { text: (r.lang || "tr").toUpperCase() }),
      h("td", null, tag(r.last_layer || "yeni", (r.last_layer || "").startsWith("L1") ? "green" : "")),
      h("td", { text: r.last_intent || "-" }),
      h("td", { text: r.msg_count || 0 }),
      h("td", { text: r.last_at ? fmtDT(r.last_at) : "-" }),
      h("td", null, h("div", { class: "actions" },
        h("button", {
          class: "btn btn-sm btn-primary",
          type: "button",
          on: {
            click: () => modal(`${r.display_name || "Hasta #" + r.id} · Otopilotu Devral`, [
              fld("Doğrudan Mesaj", h("textarea", { class: "input", name: "text", rows: 3, required: true, placeholder: "Hastaya iletilecek mesaj..." })),
            ], async (f) => {
              await api(`/app/api/conversations/${r.id}/send`, { method: "POST", body: { text: f.get("text") } });
              toast("Mesaj gönderildi");
              route();
            }, "Gönder"),
          },
        }, "Yanıtla"),
        h("button", { class: "btn btn-sm btn-ghost", type: "button", on: { click: () => openPatient(r.id) } }, "Kart")
      ))
    )) : [h("tr", null, h("td", { colSpan: 8, class: "empty", text: "Henüz mesaj kaydı yok." }))];

    const tbody = h("tbody", null, buildConvRows(rows));

    setMain(
      header("Mesajlar", "WhatsApp ve Instagram DM görüşmeleri ile 16 dilli canlı yapay zeka simülatörü."),
      simForm,
      h("div", { class: "card card-flush" }, tblWrap(h("table", { class: "table" },
        h("thead", null, h("tr", null, ["Hasta", "Kanal", "Dil", "Son Katman", "Niyet", "Mesaj", "Son Temas", ""].map((t) => h("th", { text: t })))),
        tbody
      )))
    );

            h("div", { style: "display:flex;justify-content:space-between;align-items:center;gap:6px" },
              h("strong", { text: name }),
              tag(st && st.ok ? "Çalışıyor" : "Kapalı", st && st.ok ? "green" : "yellow")
            ),
            h("small", { text: (st && st.url) || "-" })
          )
        )),
        eco.apps && eco.apps.length ? [
          h("div", { class: "section-t", text: "Bağlı Açık Kaynak Uygulama Ekosistemi" }),
          h("div", { class: "actions", style: "gap:8px" }, eco.apps.map((ap) =>
            tag(`${ap.name}: ${ap.ok ? "Hazır" : "Beklemede"}`, ap.ok ? "teal" : "")
          )),
        ] : null,
      ] : h("div", { class: "empty", text: "Ekosistem durum servisi şu an yanıt vermedi." })
    );

    setMain(
      header("Ayarlar", "Otopilot kimliği, 16 dil seçimi, slot adımı ve ekosistem altyapı durumu."),
      form,
      ecoCard
    );
  };

  // ------------------------------------------------------------------ açılış
  async function boot(forceCheck) {
    if (!forceCheck && lsGet("dc_has_session", "") !== "1" && !location.hash.startsWith("#/")) {
      return renderLogin();
    }
    try {
      const me = await fetch("/auth/me", { credentials: "same-origin", headers: { Accept: "application/json" } });
      if (!me.ok) {
        lsSet("dc_has_session", "");
        return renderLogin();
      }
      const d = await me.json();
      lsSet("dc_has_session", "1");
      Object.assign(S, {
        csrf: d.csrf,
        user: d.user,
        clinic: d.clinic,
        clinic_id: d.clinic_id || (d.user && d.user.clinic_id) || 1,
        home_clinic_id: d.home_clinic_id || (d.user && d.user.clinic_id) || 1,
        idle: d.idle_seconds || 900,
        lastAct: Date.now(),
      });
      renderShell();
    } catch (e) {
      renderLogin("Sunucuya ulaşılamadı.");
    }
  }
  boot(false);
})();
</script>
</body>
</html>
