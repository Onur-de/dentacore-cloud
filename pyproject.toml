[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["S", "B", "F"]
# B008: FastAPI dependency injection idiom (`Depends(require_perm(...))`, `Query(...)`, `Header(...)`).
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101", "S105", "S106"]
"scripts/verify_playwright_all.py" = ["S101"]
