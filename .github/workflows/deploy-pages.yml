name: DentaCore GitHub Pages Kalici Yayin

on:
  push:
    branches: ["main", "master"]
    paths:
      - "docs/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: read
  actions: read

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './docs'
          include-hidden-files: true

      - name: Pre-deploy Pages Lock Guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.error, urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          cur_sha = os.environ.get("GITHUB_SHA", "")
          tok = os.environ["GH_TOKEN"]
          hdr = {
              "Authorization": f"Bearer {tok}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          terminal = {
              "succeed",
              "deployment_failed",
              "deployment_cancelled",
              "deployment_lost",
              "deployment_content_failed",
          }

          def api(method, path):
              req = urllib.request.Request(f"https://api.github.com{path}", method=method, headers=hdr)
              try:
                  with urllib.request.urlopen(req, timeout=15) as r:
                      raw = r.read().decode("utf-8", "replace")
                      return r.status, (json.loads(raw) if raw.strip() else {})
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode("utf-8", "replace")

          def active_prior_shas():
              _, deps = api("GET", f"/repos/{repo}/deployments?environment=github-pages&per_page=8")
              if not isinstance(deps, list):
                  return []
              active = []
              seen = set()
              for d in deps:
                  sha = d.get("sha")
                  if not sha or sha == cur_sha or sha in seen:
                      continue
                  seen.add(sha)
                  st, pd = api("GET", f"/repos/{repo}/pages/deployments/{sha}")
                  if st == 200 and isinstance(pd, dict):
                      status = pd.get("status", "")
                      if status and status not in terminal:
                          active.append((sha, status))
              return active

          for attempt in range(9):
              act = active_prior_shas()
              if not act:
                  print("No active prior Pages deployment lock detected.")
                  break
              print(f"Waiting for prior Pages deployment(s): {act} (attempt {attempt + 1}/9)")
              if attempt >= 5:
                  for sha, status in act:
                      cst, _ = api("POST", f"/repos/{repo}/pages/deployments/{sha}/cancel")
                      print(f"Cancelled stale deployment {sha[:10]} ({status}): HTTP {cst}")
                  time.sleep(5)
                  break
              time.sleep(5)
          PY

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Recover Stuck Pages Lock Before Retry
        if: steps.deployment.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.error, urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          cur_sha = os.environ.get("GITHUB_SHA", "")
          tok = os.environ["GH_TOKEN"]
          hdr = {
              "Authorization": f"Bearer {tok}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          terminal = {
              "succeed",
              "deployment_failed",
              "deployment_cancelled",
              "deployment_lost",
              "deployment_content_failed",
          }

          def api(method, path):
              req = urllib.request.Request(f"https://api.github.com{path}", method=method, headers=hdr)
              try:
                  with urllib.request.urlopen(req, timeout=15) as r:
                      raw = r.read().decode("utf-8", "replace")
                      return r.status, (json.loads(raw) if raw.strip() else {})
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode("utf-8", "replace")

          _, deps = api("GET", f"/repos/{repo}/deployments?environment=github-pages&per_page=8")
          for d in (deps if isinstance(deps, list) else []):
              sha = d.get("sha")
              if not sha or sha == cur_sha:
                  continue
              st, pd = api("GET", f"/repos/{repo}/pages/deployments/{sha}")
              status = pd.get("status", "") if isinstance(pd, dict) else ""
              if st == 200 and status and status not in terminal:
                  cst, _ = api("POST", f"/repos/{repo}/pages/deployments/{sha}/cancel")
                  print(f"Cancelled blocking deployment {sha[:10]} ({status}): HTTP {cst}")
          time.sleep(12)
          PY

      - name: Deploy to GitHub Pages (Retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
