services:
  - type: web
    name: dentacore-cloud
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run_cloud.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: TZ
        value: Europe/Istanbul
      - key: TRUSTED_PROXY
        value: "1"
      - key: WEB_CONCURRENCY
        value: "2"
