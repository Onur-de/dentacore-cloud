# DentaCore Bulut Dağıtım Manifestosu (Render.com)
# UYARI: Ücretsiz (free) planda yerel dosya sistemi geçicidir; yeniden başlatmada SQLite silinir.
# Üretim klinikleri için kalıcı PostgreSQL (DATABASE_URL) ve Render Dashboard'dan gizli anahtarlar zorunludur.
services:
  - type: web
    name: dentacore-cloud
    runtime: python
    plan: starter
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: python run_cloud.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DC_ENV
        value: production
      - key: TZ
        value: Europe/Istanbul
      - key: TRUSTED_PROXY
        value: "1"
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: FORWARDED_ALLOW_IPS
        value: "127.0.0.1"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: DATABASE_URL
        fromDatabase:
          name: dentacore-pg
          property: connectionString
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: PHONE_HMAC_KEY
        sync: false
      - key: ADMIN_TOKEN
        sync: false

databases:
  - name: dentacore-pg
    plan: basic-256mb
    databaseName: dentacore
    user: dentacore
