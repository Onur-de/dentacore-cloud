services:
  - type: web
    name: dentacore-cloud
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run_cloud.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TZ
        value: Europe/Istanbul
      - key: DC_ALLOW_HTTP_LOCAL
        value: "1"
